# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
    component: api
    version: v1
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: {{ .Values.fortiaigate.updateStrategy }}
  selector:
    matchLabels:
      app: api
      component: api
  template:
    metadata:
      annotations:
        # Restart the pod when a TLS certificate changes: the external one it
        # serves, or the chart-generated internal one it trusts as a client
        checksum/tls: {{ include "fortiaigate.tlsChecksum" . | quote }}
        {{- if or .Values.tls.enabled .Values.redis.tls.enabled .Values.postgresql.tls.enabled }}
        checksum/internal-tls: {{ include "fortiaigate.internalTlsChecksum" . | quote }}
        {{- end }}
      labels:
        app: api
        component: api
        version: v1
    spec:
      # NO nodeAffinity. Pods used to be pinned to the nodes named in
      # global.licenses, which was coherent only while a licence belonged to a
      # node. A licence now covers the deployment and names no machine, so
      # there is nothing to pin to — and the pinning was load-bearing in the
      # wrong direction: with the map left at its default the rendered
      # matchExpression had an empty `values`, which Kubernetes rejects, so the
      # chart could not be installed without inventing a licence map.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: {{ .Values.fortiaigate.image.repository }}/api:{{ .Values.fortiaigate.image.tag }}
        imagePullPolicy: {{ .Values.fortiaigate.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        # api listens only once its database setup succeeds (api/cmd/api/main.go),
        # and /api/healthz answers 200 whenever it listens, outside the login and
        # licence checks. So a rollout keeps the old pod in the Service until the
        # new one serves; without this the new pod counted as ready on start and
        # the Ingress answered 502 until it listened. No livenessProbe: api waits
        # for PostgreSQL at start, and a kill during that wait only restarts it.
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: http
            {{- if .Values.tls.enabled }}
            scheme: HTTPS
            {{- end }}
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        # Environment variables
        env:
        # Keep provider health probes consistent with the LLM gateway.
        - {name: UPSTREAM_TLS_VERIFY, value: {{ .Values.llmGateway.env.upstreamTls.verify | quote }}}
        - name: FORTIAIGATE_LOG_LEVEL
          value: {{ .Values.fortiaigate.env.logLevel | quote }}
        # Failure-policy pins (fortiaigate.failurePolicy.*, #91): rendered only
        # for a knob that is set, so any knob left empty stays with the org's
        # Runtime Defaults document. One helper feeds this pod and llm-gateway, so
        # the two cannot disagree on the policy.
        {{- with (include "fortiaigate.failurePolicyEnv" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        # The guardrail dispatcher pool (faig.guardrail.v1/Scan) the detector
        # Playground scans through: POST /api/v1/.../detectors/{uuid}/test runs
        # sample text on the SAME pool llm-gateway.yaml points at, so the panel
        # reports the verdict the gateway would reach. One override answers both
        # pods (llmGateway.env.guardrailAddr); api.env.guardrailAddr wins here
        # if a deployment needs them apart. TLS posture is inferred in-process
        # from FORTIAIGATE_SSL_CERT_FILE, exactly as the gateway infers it.
        # "off" disables the Playground's server run (the endpoint answers 503).
        - name: FAIG_GUARDRAIL_ADDR
          value: {{ (.Values.api.env).guardrailAddr | default (.Values.llmGateway.env).guardrailAddr | default "guardrail:50051" | quote }}
        # SSO (SAML 2.0): tier 1 of the external-URL prefill — sso.externalUrl,
        # falling back to https://<ingress.host>. Only a PREFILL: the admin
        # confirms the value on the Authentication page and the confirmed copy
        # is what authentication validates against.
        {{- $ssoExternal := default (ternary (printf "https://%s" .Values.ingress.host) "" (ne .Values.ingress.host "")) ((.Values.sso).externalUrl) }}
        {{- if $ssoExternal }}
        - name: FORTIAIGATE_EXTERNAL_URL
          value: {{ $ssoExternal | quote }}
        {{- end }}
        {{- if .Values.auth.enabled }}
        - name: FAIG_AUTH_URL
          value: https://auth:9000
        - name: FAIG_AUTH_WORKLOAD_CERT_FILE
          value: /var/run/faig-auth/tls.crt
        - name: FAIG_AUTH_WORKLOAD_KEY_FILE
          value: /var/run/faig-auth/tls.key
        - name: FAIG_AUTH_SERVER_CA_FILE
          value: /var/run/faig-auth/ca.crt
        # Bind protected MCP profiles to the deployed gateway certificate,
        # including a supported custom workload Secret/identity pair.
        - name: FAIG_MCP_AUTH_WORKLOAD_URIS
          value: {{ list .Values.auth.mcpWorkloadIdentity | toJson | quote }}
        {{- end }}
        - name: CSRF_SECRET_KEY
          {{- if .Values.fortiaigate.env.csrfSecretKey }}
          value: {{ .Values.fortiaigate.env.csrfSecretKey | quote }}
          {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ include "fortiaigate.fullname" . }}-csrf
              key: csrf-secret-key
          {{- end }}
        # Master key sealing credential secrets at rest (go-common/secret).
        # Name resolution (explicit override, else chart-generated) lives in
        # fortiaigate.masterKeySecretName so api/llm-gateway/guardrail always
        # agree on the same key. Absent a real key: api-go refuses credential
        # writes with 503 rather than storing plaintext (v1_models.go keysource
        # contract) — but the chart now always generates one by default, so
        # that path only fires when a supplied override name doesn't exist.
        - name: FAIG_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "fortiaigate.masterKeySecretName" . }}
              key: master-key
        {{- if .Values.tls.enabled }}
        # The external certificate: what clients reach through the Ingress
        - name: FORTIAIGATE_SSL_CERT_FILE
          value: "/etc/tls-external/tls.crt"
        - name: FORTIAIGATE_SSL_KEY_FILE
          value: "/etc/tls-external/tls.key"
        # The internal certificate, which the guardrail pool and the licence
        # manager serve: the CA this pod verifies them against
        - name: FAIG_INTERNAL_TLS_CA_FILE
          value: {{ include "fortiaigate.internalTlsCAFile" . | quote }}
        {{- if include "fortiaigate.internalMtls" . }}
        # Mutual TLS (tls.mutual): the client certificate this pod presents to
        # the servers that require one, the internal pair itself
        - name: FAIG_INTERNAL_TLS_CERT_FILE
          value: {{ printf "%s/tls.crt" (include "fortiaigate.internalTlsMountPath" .) | quote }}
        - name: FAIG_INTERNAL_TLS_KEY_FILE
          value: {{ printf "%s/tls.key" (include "fortiaigate.internalTlsMountPath" .) | quote }}
        {{- end }}
        {{- end }}
        - name: REDIS_SSL_ENABLED
          value: {{ .Values.redis.tls.enabled | quote }}
        {{- if .Values.redis.tls.enabled }}
        - name: REDIS_SSL_CERTFILE
          value: {{ printf "%s/tls.crt" (include "fortiaigate.internalTlsMountPath" .) | quote }}
        - name: REDIS_SSL_KEYFILE
          value: {{ printf "%s/tls.key" (include "fortiaigate.internalTlsMountPath" .) | quote }}
        - name: REDIS_SSL_CA_CERTS
          value: {{ include "fortiaigate.internalTlsCAFile" . | quote }}
        - name: REDIS_SSL_VERIFY
          value: "true"
        {{- end }}
        - name: POSTGRES_SSL_ENABLED
          value: {{ .Values.postgresql.tls.enabled | quote }}
        {{- if .Values.postgresql.tls.enabled }}
        - name: POSTGRES_SSL_CERTFILE
          value: {{ printf "%s/tls.crt" (include "fortiaigate.internalTlsMountPath" .) | quote }}
        - name: POSTGRES_SSL_KEYFILE
          value: {{ printf "%s/tls.key" (include "fortiaigate.internalTlsMountPath" .) | quote }}
        - name: POSTGRES_SSL_CA_CERTS
          value: {{ include "fortiaigate.internalTlsCAFile" . | quote }}
        - name: POSTGRES_SSL_VERIFY
          value: "true"
        {{- end }}
        # Observability's trace cache (its REDIS_URL's database, /3): the
        # Trajectories session detail reads a session's trace there first
        # (go-common/obssession), on the Redis below.
        - name: OBSERVABILITY_REDIS_DB
          value: "3"
        # Database configuration (only what's actually used by the application)
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fortiaigate.fullname" . }}-db-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fortiaigate.fullname" . }}-db-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-redis
              key: redis-password
        # Database credentials (from auto-generated PostgreSQL secret and values)
        - name: POSTGRES_USER
          value: "{{ .Values.postgresql.auth.username }}"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgresql
              key: password
        - name: POSTGRES_DB
          value: "{{ .Values.postgresql.auth.database }}"
        - name: POSTGRES_HOST
          value: "{{ .Release.Name }}-postgresql"
        - name: POSTGRES_PORT
          value: "{{ .Values.postgresql.primary.service.port }}"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
        {{- if .Values.auth.enabled }}
        - name: auth-workload
          mountPath: /var/run/faig-auth
          readOnly: true
        {{- end }}
        - name: shared-data
          mountPath: /etc/fortiaigate/
          readOnly: false
        - name: tmp
          mountPath: /tmp
        {{- if or .Values.tls.enabled .Values.redis.tls.enabled .Values.postgresql.tls.enabled }}
        - name: tls-certs
          mountPath: {{ (include "fortiaigate.internalTlsMountPath" .) | quote }}
          readOnly: true
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: external-tls-certs
          mountPath: /etc/tls-external
          readOnly: true
        {{- end }}
      volumes:
      {{- if .Values.auth.enabled }}
      - name: auth-workload
        secret:
          secretName: {{ include "fortiaigate.authSecret" (dict "root" . "override" .Values.auth.apiWorkloadSecretName) | quote }}
          {{- include "fortiaigate.authSecretItems" (dict "component" "api" "override" .Values.auth.apiWorkloadSecretName) | nindent 10 }}
          defaultMode: 0440
      {{- end }}
      - name: shared-data
        persistentVolumeClaim:
          claimName: {{ include "fortiaigate.fullname" . }}-storage
      - name: tmp
        emptyDir: {}
      {{- if or .Values.tls.enabled .Values.redis.tls.enabled .Values.postgresql.tls.enabled }}
      - name: tls-certs
        secret:
          secretName: {{ include "fortiaigate.internalTlsSecretName" . }}
      {{- end }}
      {{- if .Values.tls.enabled }}
      - name: external-tls-certs
        secret:
          secretName: {{ include "fortiaigate.tlsSecretName" . }}
      {{- end }}
      {{- with .Values.fortiaigate.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  {{- if eq (include "fortiaigate.ingressController" .) "alb" }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthcheck.api | quote }}
    alb.ingress.kubernetes.io/success-codes: "200"
  {{- else }}
  {{- with include "fortiaigate.traefikBackendAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
  labels:
    app: api
    component: api
spec:
  selector:
    app: api
    component: api
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
