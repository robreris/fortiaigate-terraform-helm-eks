# The key api signs CSRF tokens with (CSRF_SECRET_KEY, api/internal/auth/csrf.go).
#
# `lookup` reads back the key already created, so `helm upgrade` keeps it. A new
# key on every render reached only the api pods started after it: running
# replicas kept the old one, so with api.replicas > 1 a token one replica issued
# the other rejected (403 "Invalid CSRF token").
#
# If this Secret is deleted, the next upgrade creates a new key that only api
# pods started afterwards read: restart api (`kubectl rollout restart
# deployment/api`) so every replica has it.
{{- if not .Values.fortiaigate.env.csrfSecretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fortiaigate.fullname" . }}-csrf
  namespace: {{ include "fortiaigate.namespace" . }}
  labels:
    {{- include "fortiaigate.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existing := (lookup "v1" "Secret" (include "fortiaigate.namespace" .) (printf "%s-csrf" (include "fortiaigate.fullname" .))) | default dict }}
  {{- $data := get $existing "data" | default dict }}
  csrf-secret-key: {{ (get $data "csrf-secret-key") | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
