{{- /*
Guardrail data plane: the dispatcher front door (image: guardrail) plus its two
backend scanners (dlp-scanner, policy-guard) which share a second image
(guardrail-scanner), the binary selected per Deployment by `command`. Headless
Services on :50051 (gRPC) with a gRPC readiness probe on :50052; TLS,
license-node pinning, and cert-rotation restart follow the same pattern as the
other services.

policy-guard is the POLICY scanner: it puts each Natural Language detector's
topics in front of the policyGuard model served by vLLM (templates/
vllm-server.yaml) and parses the verdict. Where vLLM does not run — no GPUs
(fortiaigate.gpu.enabled false) or vllm.replicas 0 — POLICY detectors FAIL
CLOSED (gateway 503) rather than silently passing.
*/ -}}
{{- $repo := .Values.fortiaigate.image.repository -}}
{{- $tag := (.Values.guardrail).tag | default .Values.fortiaigate.image.tag -}}
{{- $g := .Values.guardrail | default dict -}}
{{- $externalMetering := $g.externalMetering | default dict -}}
{{- /* Traffic-normalization DECODE policy (values.yaml
       guardrail.trafficNormalization.decode), rendered onto the dispatcher only
       — it is the pod that runs the stage. `default` is unusable for the
       boolean here (Helm treats false as empty, so `false | default true`
       yields true); `dig` keeps an explicit false.

       There is no character-screening variable: that half of the stage is
       per-guardrail policy, carried on each scan request, and no deployment
       setting can turn it on or off. */ -}}
{{- $tnDecode := ((.Values.guardrail).trafficNormalization).decode | default dict -}}
{{- $svcs := list
  (dict "name" "guardrail"    "img" "guardrail"         "cmd" "/app/guardrail"    "cfg" ($g.guardrail  | default dict))
  (dict "name" "dlp-scanner"  "img" "guardrail-scanner" "cmd" "/app/dlp-scanner"  "cfg" ($g.dlpScanner | default dict))
  (dict "name" "policy-guard" "img" "guardrail-scanner" "cmd" "/app/policy-guard" "cfg" ($g.policyGuard | default dict))
}}
{{- range $s := $svcs }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $s.name }}
  labels:
    app: guardrail
    guardrail-component: {{ $s.name }}
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
spec:
  replicas: {{ dig "replicas" 1 $s.cfg }}
  strategy:
    type: {{ $.Values.fortiaigate.updateStrategy }}
  selector:
    matchLabels:
      app: guardrail
      guardrail-component: {{ $s.name }}
  template:
    metadata:
      annotations:
        {{- if $.Values.tls.enabled }}
        # restart the pod when the chart-generated internal certificate changes
        checksum/internal-tls: {{ include "fortiaigate.internalTlsChecksum" $ | quote }}
        {{- end }}
      labels:
        app: guardrail
        guardrail-component: {{ $s.name }}
        app.kubernetes.io/name: fortiaigate
        app.kubernetes.io/part-of: fortiaigate-platform
        app.kubernetes.io/managed-by: helm
    spec:
      # NO nodeAffinity. Pods used to be pinned to the nodes named in
      # global.licenses, which was coherent only while a licence belonged to a
      # node. A licence now covers the deployment and names no machine, so
      # there is nothing to pin to — and the pinning was load-bearing in the
      # wrong direction: with the map left at its default the rendered
      # matchExpression had an empty `values`, which Kubernetes rejects, so the
      # chart could not be installed without inventing a licence map.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: {{ $s.name }}
        image: {{ $repo }}/{{ $s.img }}:{{ $tag }}
        imagePullPolicy: {{ $.Values.fortiaigate.image.pullPolicy }}
        command: ["{{ $s.cmd }}"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 50051
        - containerPort: 50052
        readinessProbe:
          grpc:
            port: 50052
          initialDelaySeconds: 3
          periodSeconds: 10
        env:
        - name: FORTIAIGATE_LOG_LEVEL
          value: {{ $.Values.fortiaigate.env.logLevel | quote }}
        # The scan-request cap. Enforced ONCE, at the dispatcher's receiving
        # side (the scanners and every client run at the transport ceiling,
        # and replies are never size-capped, so oversized rewritten results
        # still flow back); also what ListCapabilities advertises. The plugin
        # adapter reads the same value to size its body limit
        # (plugin-adapter.yaml), and inference-hooks to trim a transcript to it
        # (inference-hooks.yaml); no other pod needs it.
        - name: GUARDRAIL_MAX_REQUEST_BYTES
          value: {{ (($g).env).maxRequestBytes | default "67108864" | quote }}
        {{- if eq $s.name "guardrail" }}
        - name: GUARDRAIL_DLP_ADDR
          value: "dlp-scanner:50051"
        - name: GUARDRAIL_POLICY_ADDR
          value: "policy-guard:50051"
        - name: GUARDRAIL_POOL_VERSION
          value: "v1-{{ $tag }}"
        # The two GPU scan-queue sizes: guardrail.guardrail.env when set there,
        # else the fortiaigate.gpu.type profile (files/gpu-profiles.yaml;
        # 2000000 in default). Rendered HERE and skipped by
        # the generic env loop below, so an empty values.yaml entry never
        # reaches the pod as "" — the dispatcher would then read its own
        # built-in 10000000 and nothing in the chart would say so. "0" (no
        # limit) is a legal explicit value and is passed through.
        - name: GUARDRAIL_DLP_QUEUE_CHARS
          value: {{ include "fortiaigate.gpuParamInt" (dict "root" $ "section" "guardrail" "key" "dlpQueueChars" "explicit" (dig "env" "GUARDRAIL_DLP_QUEUE_CHARS" "" $s.cfg) "what" "guardrail.guardrail.env.GUARDRAIL_DLP_QUEUE_CHARS" "min" 0) | quote }}
        - name: GUARDRAIL_POLICY_QUEUE_CHARS
          value: {{ include "fortiaigate.gpuParamInt" (dict "root" $ "section" "guardrail" "key" "policyQueueChars" "explicit" (dig "env" "GUARDRAIL_POLICY_QUEUE_CHARS" "" $s.cfg) "what" "guardrail.guardrail.env.GUARDRAIL_POLICY_QUEUE_CHARS" "min" 0) | quote }}
        # Master key that seals the response vault (the placeholder→original PII
        # map). Same secret api/llm-gateway use — see fortiaigate.masterKeySecretName.
        - name: FAIG_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "fortiaigate.masterKeySecretName" $ }}
              key: master-key
        # Traffic normalization, decode half: the pre-detector stage that peels
        # base64 / percent / \uXXXX / \xXX so detectors see real text. Read
        # ONCE at dispatcher startup and applied to every scan whose ScanRequest
        # omits `normalization` — which is every scan the gateway sends. A bad
        # limit action is fatal at start, never defaulted: silently forwarding
        # at the decode cap where the operator asked to reject is a fail-open
        # gap.
        # The pool's answer for every scan that does not carry its own
        # `short_circuit` — which is every scan the gateway sends, so this is
        # what decides it in practice. ON: the stages run cheapest-first, so a
        # DENY from character screening or the in-process regex stage skips the
        # DLP + policyGuard GPU calls it has already made moot. It cannot move
        # a VERDICT; what it changes is that the skipped detectors report
        # SHORT_CIRCUITED and contribute no findings, so a denied request's
        # violation details name what denied it and not what went unchecked.
        - name: GUARDRAIL_SHORT_CIRCUIT_DEFAULT
          value: {{ dig "shortCircuitDefault" true (($g).env | default dict) | quote }}
        - name: GUARDRAIL_NORMALIZATION_DECODE
          value: {{ ternary "true" "false" (dig "enabled" true $tnDecode) | quote }}
        - name: GUARDRAIL_NORMALIZATION_MAX_DECODE_LAYERS
          value: {{ dig "maxLayers" 2 $tnDecode | quote }}
        - name: GUARDRAIL_NORMALIZATION_DECODE_LIMIT_ACTION
          value: {{ dig "limitAction" "deny" $tnDecode | quote }}
        {{- end }}
        {{- if eq $s.name "policy-guard" }}
        {{- if include "fortiaigate.vllmEnabled" $ }}
        # The policyGuard model: vLLM's OpenAI-compatible server (Service
        # vllm-server, templates/vllm-server.yaml — headless, so the port here
        # is the one the container listens on, from the same helper _vllm.tpl
        # renders --port from; 8100, not vLLM's upstream 8000, because in
        # shared mode the container shares the triton-vllm-server pod's network
        # namespace and 8000 is Triton's). The model name comes from the ONE
        # helper the container's --served-model-name also uses, so the two
        # cannot drift; it is not a value, because a customer who repointed it
        # would fail every POLICY scan closed. Tuning knobs (per-call timeout,
        # chunking, concurrency) go in guardrail.policyGuard.env. https when
        # vLLM serves TLS (fortiaigate.vllmTls), verified against
        # FAIG_INTERNAL_TLS_CA_FILE below.
        - name: POLICYGUARD_VLLM_URL
          value: "{{ if include "fortiaigate.vllmTls" $ }}https{{ else }}http{{ end }}://vllm-server:{{ include "fortiaigate.vllmHTTPPort" $ }}"
        - name: POLICYGUARD_VLLM_MODEL
          value: {{ include "fortiaigate.policyGuardModelName" $ | quote }}
        {{- else }}
        # No vLLM in this deployment -- either vllm.replicas is 0 or this is
        # a non-GPU deployment (fortiaigate.gpu.enabled false), which vLLM
        # cannot serve at all.
        #
        # policy-guard then FAILS every POLICY detector CLOSED: the dispatcher
        # folds that to UNAVAILABLE and the gateway answers 503, carrying a
        # reason that names what is missing. It deliberately does NOT return
        # clean -- a Natural Language detector that passes without a model
        # would tell an org its rules are enforced while nothing evaluates
        # them. DLP and REGEX are unaffected, so a CPU deployment still scans
        # everything else; only policies carrying a Natural Language detector
        # are refused.
        - name: POLICYGUARD_STUB
          value: "true"
        {{- end }}
        {{- end }}
        {{- if eq $s.name "guardrail" }}
        # The accelerator inventory the licence manager reads through this pod
        # (interface-spec §6.2). HEADLESS names, deliberately: each is resolved
        # to EVERY pod behind it and each pod is scraped, because a ClusterIP
        # would answer from one engine and the fleet would be undercounted.
        #
        # Empty would make this pool answer UNIMPLEMENTED instead of reporting
        # zero cards — a distinction that matters, so the list is built from
        # what is actually deployed rather than hardcoded.
        # Prometheus endpoints carrying a gpu_uuid label. Triton publishes
        # nv_gpu_* on :8002 as shipped, so a stock engine is countable with no
        # image change at all — the reporter, where present, still wins the
        # merge because only it resolves a MIG slice, names the product and
        # stamps the node. vLLM publishes no GPU labels, so it is not listed.
        # vLLM's reporter listens on its own port (9110, _vllm.tpl): in
        # shared mode it shares the triton-vllm-server pod with Triton's
        # reporter on 9109, and the names below are headless, so the port is
        # the pod's. Two reporters then name the same card; the scraper dedups
        # by uuid and counts one.
        - name: GUARDRAIL_METERING_METRICS_ENDPOINTS
          value: "{{ $eps := list }}{{ if and (($.Values.fortiaigate.gpu).enabled) (gt (int (($.Values.triton).replicas)) 0) }}{{ $eps = append $eps "triton-server-metering:8002" }}{{ end }}{{ $eps = concat $eps (get $externalMetering "metricsEndpoints" | default list) }}{{ join "," $eps }}"
        - name: GUARDRAIL_METERING_ENDPOINTS
          value: "{{ $eps := list }}{{ if and (($.Values.fortiaigate.gpu).enabled) (gt (int (($.Values.triton).replicas)) 0) }}{{ $eps = append $eps "triton-server-metering:9109" }}{{ end }}{{ if include "fortiaigate.vllmEnabled" $ }}{{ $eps = append $eps (printf "vllm-server-metering:%s" (include "fortiaigate.vllmReporterPort" $)) }}{{ end }}{{ $eps = concat $eps (get $externalMetering "reporterEndpoints" | default list) }}{{ join "," $eps }}"
        # Both names are headless. Union their addresses so narrowing the
        # metering selector cannot hide a pod still reachable for inference.
        # Meter-only addresses are expected while models are not ready yet.
        - name: GUARDRAIL_METERING_SERVICE_PAIRS
          value: "{{ $pairs := list }}{{ if and (($.Values.fortiaigate.gpu).enabled) (gt (int (($.Values.triton).replicas)) 0) }}{{ $pairs = append $pairs "triton-server=triton-server-metering" }}{{ end }}{{ if include "fortiaigate.vllmEnabled" $ }}{{ $pairs = append $pairs "vllm-server=vllm-server-metering" }}{{ end }}{{ $pairs = concat $pairs (get $externalMetering "servicePairs" | default list) }}{{ join "," $pairs }}"
        {{- end }}
        {{- if eq $s.name "guardrail" }}
        # The scan cap in o200k_base tokens (guardrail.env.maxScanTokens): the
        # most of a block any detector reads, and, 4 bytes a token, the
        # per-block admission charge. The dispatcher alone reads it; the
        # scanners keep a fixed ceiling of their own.
        - name: SCANNER_MAX_SCAN_TOKENS
          value: {{ $.Values.guardrail.env.maxScanTokens | quote }}
        {{- end }}
        {{- if ne $s.name "guardrail" }}
        # Scanner detection-cache budget in bytes. Empty = automatic
        # (25% of this container's memory limit). The cache is always capped at
        # that 25% ceiling even when this number is never reached: a larger
        # value is clamped down to it at startup. "0" disables the cache.
        # dlp-scanner caches GLiNER predictions keyed by the scanned text;
        # policy-guard caches policyGuard verdicts keyed by the rendered rules
        # AND a tool definition's text (as truncated, before it is cut into
        # model windows), so a rule or strictness edit misses on its own — for
        # tool definitions only; its combined conversation is vLLM's prefix
        # cache's.
        - name: SCANNER_CACHE_MAX_BYTES
          value: {{ $.Values.guardrail.env.cacheMaxBytes | quote }}
        {{- end }}
        {{- if $.Values.tls.enabled }}
        - name: FORTIAIGATE_SSL_CERT_FILE
          value: {{ printf "%s/tls.crt" (include "fortiaigate.internalTlsMountPath" $) | quote }}
        - name: FORTIAIGATE_SSL_KEY_FILE
          value: {{ printf "%s/tls.key" (include "fortiaigate.internalTlsMountPath" $) | quote }}
        # The CA this pod verifies its servers against: the internal
        # certificate, served by the dispatcher's two backends, by Triton (the
        # DLP scanner's) and by vLLM (policy-guard's), each name in its SANs.
        # Under mutual TLS, also the one its own gRPC port verifies clients
        # against.
        - name: FAIG_INTERNAL_TLS_CA_FILE
          value: {{ include "fortiaigate.internalTlsCAFile" $ | quote }}
        {{- if include "fortiaigate.internalMtls" $ }}
        # Mutual TLS (tls.mutual): the client certificate this pod presents to
        # the servers that require one, the internal pair itself
        - name: FAIG_INTERNAL_TLS_CERT_FILE
          value: {{ printf "%s/tls.crt" (include "fortiaigate.internalTlsMountPath" $) | quote }}
        - name: FAIG_INTERNAL_TLS_KEY_FILE
          value: {{ printf "%s/tls.key" (include "fortiaigate.internalTlsMountPath" $) | quote }}
        {{- end }}
        {{- if include "fortiaigate.internalMtls" $ }}
        # Mutual TLS: the gRPC port (:50051) accepts only a client whose
        # certificate verifies against the internal certificate. The health
        # port (:50052) stays plaintext for the kubelet's probes.
        - name: FAIG_INTERNAL_TLS_CLIENT_AUTH
          value: "require"
        {{- end }}
        {{- if eq $s.name "dlp-scanner" }}
        # Triton serves gRPC over TLS with tls.enabled (triton-server.yaml).
        - name: TRITON_TLS
          value: "true"
        {{- end }}
        {{- end }}
        {{- /* per-component extra env (e.g. dlp-scanner CHUNK_SIZE / CHUNK_OVERLAP_SIZE).
               The dispatcher's two GPU queue sizes are rendered above, from
               the profile when empty here. */}}
        {{- range $k, $v := $s.cfg.env }}
        {{- if not (and (eq $s.name "guardrail") (has $k (list "GUARDRAIL_DLP_QUEUE_CHARS" "GUARDRAIL_POLICY_QUEUE_CHARS"))) }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        {{- end }}
        {{- /* per-component resources (each component sets its own; empty if unset) */}}
        resources: {{ toYaml ($s.cfg.resources | default dict) | nindent 10 }}
        {{- if $.Values.tls.enabled }}
        volumeMounts:
        - name: tls-certs
          mountPath: {{ (include "fortiaigate.internalTlsMountPath" $) | quote }}
          readOnly: true
        {{- end }}
      {{- if $.Values.tls.enabled }}
      volumes:
      - name: tls-certs
        secret:
          secretName: {{ include "fortiaigate.internalTlsSecretName" $ }}
      {{- end }}
      {{- with $.Values.fortiaigate.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $s.name }}
  labels:
    app: guardrail
    guardrail-component: {{ $s.name }}
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
spec:
  clusterIP: None  # headless for gRPC client-side load balancing
  selector:
    app: guardrail
    guardrail-component: {{ $s.name }}
  ports:
  - protocol: TCP
    port: 50051
    targetPort: 50051
    name: grpc
---
{{- end }}
