apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fortiaigate-ingress
  labels:
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
  annotations:
    {{- include "fortiaigate.ingressAnnotations" . | nindent 4 }}

spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}

  {{- if and .Values.tls.enabled (ne (include "fortiaigate.ingressController" .) "alb") }}
  tls:
  - hosts:
    {{- if .Values.ingress.host }}
    - {{ .Values.ingress.host }}
    {{- else }}
    - "*.local"
    {{- end }}
    secretName: {{ include "fortiaigate.tlsSecretName" . }}
  {{- end }}

  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          # webui is served under the /ui basePath. More-specific API prefixes
          # are matched first; /ui and / route the webui; /ai routes the LLM
          # data plane (llm-gateway), which serves that mount root and nothing
          # outside it.
          #
          # OAuth and SCIM use the same HTTPS backend settings as the other
          # public routes. The private Auth workload port 9000 has no route.
          {{- range $entry := list (dict "port" 9002 "paths" (list "/oauth" "/.well-known/oauth-authorization-server/oauth" "/.well-known/openid-configuration/oauth" "/api/auth/sso/oidc/callback")) (dict "port" 9444 "paths" (list "/scim/v2" "/api/v1/scim")) }}
          {{- range $path := $entry.paths }}
          - path: {{ $path }}
            pathType: {{ if hasPrefix "/.well-known/" $path }}{{ include "fortiaigate.metadataPathType" $ }}{{ else }}Prefix{{ end }}
            backend:
              service:
                name: auth
                port:
                  number: {{ $entry.port }}
          {{- end }}
          {{- end }}
          # /api/v1/plugins/claude-code -> the plugin adapter's MCP endpoint (the
          # Claude Code plugin's Connector, /api/v1/plugins/claude-code/mcp),
          # passed through unchanged; nothing else under /api/ goes there. BEFORE
          # /api/: nginx takes the longest prefix anyway, but an ALB evaluates
          # its rules in this order.
          - path: /api/v1/plugins/claude-code
            pathType: Prefix
            backend:
              service:
                name: plugin-adapter-mcp
                port:
                  number: 8767
          {{- if include "fortiaigate.deviceAdapterOn" . }}
          # /plugin/device -> device-adapter, the device plugin's end (managed
          # devices running FortiAIGate Client, docs/8.0.3/managed-devices),
          # passed through unchanged. Before /plugin, which goes to
          # plugin-adapter in development mode.
          - path: /plugin/device
            pathType: Prefix
            backend:
              service:
                name: device-adapter
                port:
                  number: 8768
          {{- end }}
          # /api/ carries the WHOLE management API, /api/v1 included -- one
          # backend, no per-prefix split (but for the plugin endpoint above).
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /ui
            pathType: Prefix
            backend:
              service:
                name: webui
                port:
                  number: 3000
          # /ai -> the LLM data plane. The path is passed through UNCHANGED:
          # llm-gateway owns this mount root itself and serves /ai/openai,
          # /ai/anthropic, /ai/gemini (llm-gateway/internal/dialect.MountRoot).
          #
          # Deliberately NOT a rewrite that strips /ai. rewrite-target is
          # annotation-scoped -- it would apply to every path in this Ingress,
          # 404ing /api and /ui -- so stripping would need a second Ingress
          # object, and `ingress.annotations` REPLACES the chart's defaults
          # rather than merging, so a customer setting any annotation there
          # would silently drop the rewrite. The gateway would then answer with
          # a well-formed 404 and nothing anywhere would say why.
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: llm-gateway
                port:
                  number: 8080
          {{- $paDev := eq (toString (.Values.pluginAdapter).legacyDevAuth) "true" }}
          {{- if or $paDev .Values.tls.enabled }}
          # /plugin -> the plugin adapter, in both modes. Passed through
          # unchanged: the adapter serves /plugin/claude/v1/scan and
          # /plugin/health/* itself, so no rewrite and no second Ingress.
          # Managed, its Service listener serves the two health paths alone
          # (the scans are on the pod's loopback), always over HTTPS: the
          # route needs tls.enabled, which makes this Ingress speak HTTPS to
          # its backends.
          - path: /plugin
            pathType: Prefix
            backend:
              service:
                name: plugin-adapter
                port:
                  number: 8765
          {{- end }}
          # /mcp/gateways -> mcp-gateway's MCP endpoint (virtual key), and its
          # OAuth protected-resource metadata. With tls.enabled to :8443, where
          # the gateway serves these alone over HTTPS; else :8001. Never
          # /internal (templates/mcp-gateway.yaml).
          {{- $mcpPort := ternary 8443 8001 .Values.tls.enabled }}
          - path: /mcp/gateways
            pathType: Prefix
            backend:
              service:
                name: mcp-gateway
                port:
                  number: {{ $mcpPort }}
          - path: /.well-known/oauth-protected-resource/mcp/gateways
            pathType: {{ include "fortiaigate.metadataPathType" . }}
            backend:
              service:
                name: mcp-gateway
                port:
                  number: {{ $mcpPort }}
          # Root -> the console, matching the docker deployment (nginx.conf
          # sends `= /` to /ui). The gateway used to be the catch-all here, so
          # every typo landed on the data plane and came back as dialect JSON;
          # it now owns /ai and nothing else, which is what lets a passthrough
          # namespace be admin-defined without a reserved-prefix list.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webui
                port:
                  number: 3000
