{{- if not .Values.fortiaigate.internalTokenExistingSecret }}
# FAIG_INTERNAL_TOKEN: the platform's service secret, which mcp-gateway
# signs its relay sessions with and presents to its companions, and which
# plugin-adapter and the companions check (FAIG_MCP_ADMISSION_KEY). They read
# it from this Secret, so they can never disagree.
#
# `lookup` reads back an existing token so `helm upgrade` does not reroll it:
# running pods keep the value they started with, and a rerolled Secret would
# leave the services on different tokens until they restart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fortiaigate.fullname" . }}-internal-token
  namespace: {{ include "fortiaigate.namespace" . }}
  labels:
    {{- include "fortiaigate.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existing := (lookup "v1" "Secret" (include "fortiaigate.namespace" .) (printf "%s-internal-token" (include "fortiaigate.fullname" .))) | default dict }}
  {{- $existingData := (get $existing "data") | default dict }}
  internal-token: {{ (get $existingData "internal-token") | default (randAlphaNum 48 | b64enc) }}
{{- end }}
