# Observability — agent session/trace recording, on :8004: the Go port of
# VirtueAI's observability (observability/; docs/VirtueAI/observability/).
# It serves the session/trace routes only; every other route answers 404
# (TODO.md B2), and there is no worker. The Python service is retired.
#
# Always deployed. MCP Gateway and plugin-adapter record sessions and traces
# here, through OBSERVABILITY_URL. The session log itself (sessions, traces,
# their links) is in FortiAIGate's database (go-common migration 0089, which
# api applies), written through FAIG_DATABASE_URL: api serves the Trajectories
# pages from it and Action Guard reads a session's history there, both
# reading this service's trace cache (REDIS_URL's database, 3) first
# (docs/VirtueAI/observability/DEVIATIONS.md #24); this service and Action
# Guard's reader create that cache, once no write is pending
# (trace-cache-design.md). It has no database of its own (#25).
# With tls.enabled it serves HTTPS on the internal certificate, which names it,
# and under tls.mutual only to the pods that present the internal pair; its
# callers' OBSERVABILITY_URL is https.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability
  labels:
    app: observability
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
    component: observability
    version: v1
spec:
  replicas: {{ .Values.observability.replicas }}
  strategy:
    type: {{ .Values.fortiaigate.updateStrategy }}
  selector:
    matchLabels:
      app: observability
      component: observability
  template:
    metadata:
      annotations:
        {{- if or .Values.tls.enabled .Values.redis.tls.enabled .Values.postgresql.tls.enabled }}
        checksum/internal-tls: {{ include "fortiaigate.internalTlsChecksum" . | quote }}
        {{- end }}
      labels:
        app: observability
        component: observability
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: observability
        image: {{ .Values.fortiaigate.image.repository }}/observability:{{ .Values.fortiaigate.image.tag }}
        imagePullPolicy: {{ .Values.fortiaigate.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8004
          name: http
          protocol: TCP
        # /healthz is a static handler: it does NOT touch the database, so it
        # reports "process is up", not "usable" — the liveness probe. /readyz
        # pings Redis and the database, and fails while either is down (TODO.md
        # A1) or while the trace write queue is 90 % full (A8): the pod then
        # takes no new traffic and drains. The binary starts in well under a
        # second. Neither path needs a client certificate under tls.mutual.
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
            {{- if .Values.tls.enabled }}
            scheme: HTTPS
            {{- end }}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
            {{- if .Values.tls.enabled }}
            scheme: HTTPS
            {{- end }}
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.observability.resources | nindent 10 }}
        env:
        {{- if .Values.tls.enabled }}
        # ---- its own API: HTTPS on the internal certificate ----------------
        # Under tls.mutual only to the pods that present the internal pair,
        # verified against the internal certificate; /healthz and /readyz stay
        # open for the probes. It dials no other pod over TLS but PostgreSQL
        # and Redis, whose clients take their own settings, so it names no
        # client certificate of its own here.
        {{- if include "fortiaigate.internalMtls" . }}
        - name: FAIG_INTERNAL_TLS_CA_FILE
          value: {{ include "fortiaigate.internalTlsCAFile" . | quote }}
        - name: FAIG_INTERNAL_TLS_CLIENT_AUTH
          value: "require"
        {{- end }}
        - name: FORTIAIGATE_SSL_CERT_FILE
          value: {{ printf "%s/tls.crt" (include "fortiaigate.internalTlsMountPath" .) | quote }}
        - name: FORTIAIGATE_SSL_KEY_FILE
          value: {{ printf "%s/tls.key" (include "fortiaigate.internalTlsMountPath" .) | quote }}
        {{- end }}
        {{- /* The key the MCP companion admissions are signed with: by
        mcp-gateway, and by a managed plugin-adapter for the plugin's tool
        activity and conversations (docs/8.0.3/plugin/src/plugin-adapter-tool-scan.md). */}}
        - name: FAIG_MCP_ADMISSION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "fortiaigate.internalTokenSecretName" . }}
              key: internal-token
        - name: LOG_LEVEL
          value: {{ .Values.fortiaigate.env.logLevel | quote }}
        # ---- shared PostgreSQL: FortiAIGate's database (FAIG_DATABASE_URL below)
        # $(POSTGRES_PASSWORD) is expanded by the kubelet against the variable
        # declared just above its use.
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgresql
              key: password
        # observability.env sets the session pool's Helm defaults to 25/10.
        # Retain the 10/5 fallback when either key is absent.
        {{- $obsEnv := .Values.observability.env | default dict }}
        {{- if not (hasKey $obsEnv "DB_POOL_SIZE") }}
        - name: DB_POOL_SIZE
          value: "10"
        {{- end }}
        {{- if not (hasKey $obsEnv "DB_MAX_OVERFLOW") }}
        - name: DB_MAX_OVERFLOW
          value: "5"
        {{- end }}
        # ---- shared Redis, observability's own logical database --------------
        # Redis holds the trace cache that api's Trajectories pages and Action
        # Guard read first, and the cached half of a guard patch. Step ids are
        # NOT reserved here: they come from the session row in the database, so
        # Redis being down no longer numbers every trace 0 (TODO.md A1). While
        # it is down the cache is cold and /readyz reports not ready.
        #
        # REDIS_CLUSTER MUST be false: a cluster client against this standalone
        # Redis fails every call, which is Redis being down (TODO.md A17).
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-redis
              key: redis-password
        # Redis database 3: 0 is every other service's, 2 action-guard's. Its
        # readers (api, action-guard) look for the trace cache there. With
        # redis.tls.enabled, Redis is verified against the internal
        # certificate and the internal pair is presented, which
        # redis.tls.authClients requires (fortiaigate.companionRedisURL).
        - name: REDIS_URL
          value: {{ include "fortiaigate.companionRedisURL" (dict "root" . "db" 3) | quote }}
        - name: REDIS_CLUSTER
          value: "false"
        # ---- FortiAIGate's database: keys and the session log ----------------
        # Callers authenticate with a FortiAIGate virtual key (go-common/vkauth,
        # as action-guard checks them), read here (public schema); the session
        # log is written here too (required: the service will not start
        # without it). Their L2 cache and vk_invalidate are on the
        # shared Redis's database 0 (go-common/redis, REDIS_HOST + REDIS_DB
        # unset), NOT the REDIS_URL database above.
        - name: FAIG_DATABASE_URL
          value: "postgresql://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql:{{ .Values.postgresql.primary.service.port }}/{{ .Values.postgresql.auth.database }}?ssl={{ ternary "verify-full" "disable" .Values.postgresql.tls.enabled }}{{ if .Values.postgresql.tls.enabled }}&sslrootcert={{ include "fortiaigate.internalTlsCAFile" . }}&sslcert={{ (include "fortiaigate.internalTlsMountPath" .) }}/tls.crt&sslkey={{ (include "fortiaigate.internalTlsMountPath" .) }}/tls.key{{ end }}"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "fortiaigate.fullname" . }}-db-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fortiaigate.fullname" . }}-db-config
              key: REDIS_PORT
        - name: REDIS_SSL_VERIFY
          value: "true"
        - name: REDIS_SSL_ENABLED
          value: {{ .Values.redis.tls.enabled | quote }}
        {{- if .Values.redis.tls.enabled }}
        - name: REDIS_SSL_CERTFILE
          value: {{ printf "%s/tls.crt" (include "fortiaigate.internalTlsMountPath" .) | quote }}
        - name: REDIS_SSL_KEYFILE
          value: {{ printf "%s/tls.key" (include "fortiaigate.internalTlsMountPath" .) | quote }}
        - name: REDIS_SSL_CA_CERTS
          value: {{ include "fortiaigate.internalTlsCAFile" . | quote }}
        {{- end }}
        # ---- the rest, verbatim from values ----------------------------------
        {{- range $k, $v := .Values.observability.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        volumeMounts:
        # Writable scratch for WeasyPrint / matplotlib / fontconfig caches —
        # MPLCONFIGDIR and XDG_CACHE_HOME point here in the image.
        - name: tmp
          mountPath: /tmp
        {{- if or .Values.tls.enabled .Values.redis.tls.enabled .Values.postgresql.tls.enabled }}
        - name: tls-certs
          mountPath: {{ (include "fortiaigate.internalTlsMountPath" .) | quote }}
          readOnly: true
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if or .Values.tls.enabled .Values.redis.tls.enabled .Values.postgresql.tls.enabled }}
      - name: tls-certs
        secret:
          secretName: {{ include "fortiaigate.internalTlsSecretName" . }}
      {{- end }}
      {{- with .Values.fortiaigate.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: observability
  labels:
    app: observability
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    component: observability
spec:
  # ClusterIP only, and NOT on the ingress (templates/ingress.yaml routes only
  # /api/, /ui, /ai, /). Note that /swagger, /redoc and /internal/metrics are
  # served without a virtual key on this port: under tls.mutual only to the
  # pods that present the internal pair, else contained by it not being
  # reachable from outside the cluster. Re-check if an ingress rule is ever
  # added.
  #
  # The name and port are what mcp-gateway's, plugin-adapter's and
  # inference-hooks' OBSERVABILITY_URL expect (https with tls.enabled). The
  # port keeps the name http with tls.enabled.
  type: ClusterIP
  selector:
    app: observability
    component: observability
  ports:
  - name: http
    port: 8004
    targetPort: http
    protocol: TCP
