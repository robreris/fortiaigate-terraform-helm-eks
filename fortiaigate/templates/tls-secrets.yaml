{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) }}
# The EXTERNAL certificate: tls.cert / tls.key, self-signed or signed by a CA.
# Only the Ingress and the pods it routes to (webui, api, llm-gateway,
# plugin-adapter, mcp-gateway, inference-hooks) present it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fortiaigate.tlsSecretName" . }}
  labels:
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
type: kubernetes.io/tls
data:
  tls.crt: {{ tpl (.Files.Get .Values.tls.cert) $ | b64enc }}
  tls.key: {{ tpl (.Files.Get .Values.tls.key) $ | b64enc }}
{{- end }}
{{- if and (or .Values.tls.enabled .Values.postgresql.tls.enabled .Values.redis.tls.enabled) (not .Values.tls.internalExistingSecret) }}
{{- $tls := include "fortiaigate.internalTls" . | fromJson }}
{{- $data := (lookup "v1" "Secret" .Release.Namespace "fortiaigate-tls-secret").data }}
{{- if $tls.renew }}
{{- $names := list }}
{{- range splitList "," $tls.names }}{{ $names = append $names . }}{{ end }}
{{- $cert := genSelfSignedCert "fortiaigate-internal" (list "127.0.0.1") $names (int $tls.days) }}
{{- $data = dict "tls.crt" ($cert.Cert | b64enc) "tls.key" ($cert.Key | b64enc) }}
{{- end }}
---
# The INTERNAL certificate, for traffic between the deployment's own pods: the
# guardrail pool, license-manager, Triton, vLLM, PostgreSQL, Redis and their
# clients. It is self-signed, so tls.crt is also the CA its clients trust, and
# they check the name they dial against its SANs (fortiaigate.internalTlsNames).
# The chart generates it, valid 10 years, on the first install, on the first
# upgrade from a chart that kept the external certificate under this name
# (8.0.2 and earlier), on any upgrade that adds a name, and on any upgrade once
# it expires in fewer than 5 years (fortiaigate.internalTlsDecide). Otherwise
# it is kept. To replace it sooner, delete this Secret and run `helm upgrade`.
# Either way every pod that uses it restarts.
#
# It keeps the old name because the PostgreSQL and Redis sub-charts take the
# name from values (postgresql.tls.certificatesSecret, redis.tls.existingSecret),
# so values files written for 8.0.2 keep working unchanged.
apiVersion: v1
kind: Secret
metadata:
  name: fortiaigate-tls-secret
  labels:
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
  annotations:
    fortiaigate.io/internal-tls-revision: {{ $tls.revision | quote }}
    # When tls.crt expires. Helm cannot read a certificate, so the renewal
    # check reads this instead.
    fortiaigate.io/internal-tls-not-after: {{ $tls.notAfter | quote }}
    # The DNS names tls.crt carries, so an upgrade that adds one regenerates it.
    fortiaigate.io/internal-tls-names: {{ $tls.names | quote }}
type: kubernetes.io/tls
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
