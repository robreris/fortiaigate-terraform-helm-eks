{{- /*
The transport Traefik dials the platform's HTTPS backends with
(fortiaigate.traefikBackendAnnotations), unless ingress.traefik.serversTransport
names the operator's. It does not verify the backend certificate, as
ingress-nginx (proxy-ssl-verify off) and an ALB do not either: the chart's
default certificate (tls.cert) carries no SAN to verify a Service name
against. To verify, create a ServersTransport with your CA and serverName and
set ingress.traefik.serversTransport.
*/ -}}
{{- if and (or .Values.tls.enabled .Values.auth.enabled) (eq (include "fortiaigate.ingressController" .) "traefik") (not ((.Values.ingress).traefik).serversTransport) }}
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: fortiaigate-backend-tls
  labels:
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
spec:
  insecureSkipVerify: true
{{- end }}
