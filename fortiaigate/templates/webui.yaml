# WebUI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  labels:
    app: webui
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
spec:
  replicas: {{ .Values.webui.replicas }}
  strategy:
    type: {{ .Values.fortiaigate.updateStrategy }}
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      annotations:
        # This is the key that triggers a restart when TLS certificates change
        checksum/tls: {{ include "fortiaigate.tlsChecksum" . | quote }}
      labels:
        app: webui
    spec:
      # NO nodeAffinity. Pods used to be pinned to the nodes named in
      # global.licenses, which was coherent only while a licence belonged to a
      # node. A licence now covers the deployment and names no machine, so
      # there is nothing to pin to — and the pinning was load-bearing in the
      # wrong direction: with the map left at its default the rendered
      # matchExpression had an empty `values`, which Kubernetes rejects, so the
      # chart could not be installed without inventing a licence map.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: webui
        image: {{ .Values.fortiaigate.image.repository }}/webui:{{ .Values.webui.image.tag | default .Values.fortiaigate.image.tag }}
        imagePullPolicy: {{ .Values.fortiaigate.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        # No command: the 8.0.3 console (fortiaigate-fe) is nginx on its stock
        # entrypoint. Its listen script serves HTTPS on :3000 when both
        # FORTIAIGATE_SSL_* below are set, and writes only /tmp, so it runs as
        # uid 10001.
        ports:
        - containerPort: 3000
        resources:
          {{- toYaml .Values.webui.resources | nindent 10 }}
        env:
        - name: LOG_LEVEL
          value: {{ .Values.fortiaigate.env.logLevel | quote }}
        {{- if .Values.tls.enabled }}
        - name: FORTIAIGATE_SSL_CERT_FILE
          value: {{ printf "%s/tls.crt" .Values.tls.mountPath | quote }}
        - name: FORTIAIGATE_SSL_KEY_FILE
          value: {{ printf "%s/tls.key" .Values.tls.mountPath | quote }}
        {{- end }}
        # Add other environment variables as needed
        # - name: NODE_ENV
        #   value: "production"
        {{- if .Values.tls.enabled }}
        volumeMounts:
        - name: tls-certs
          mountPath: {{ .Values.tls.mountPath | quote }}
          readOnly: true
        {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
      - name: tls-certs
        secret:
          secretName: {{ include "fortiaigate.tlsSecretName" . }}
      {{- end }}
      {{- with .Values.fortiaigate.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# WebUI Service
apiVersion: v1
kind: Service
metadata:
  name: webui
  {{- if eq (include "fortiaigate.ingressController" .) "alb" }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthcheck.webui | quote }}
    alb.ingress.kubernetes.io/success-codes: "200"
  {{- else }}
  {{- with include "fortiaigate.traefikBackendAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
spec:
  selector:
    app: webui
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    name: http
  type: ClusterIP