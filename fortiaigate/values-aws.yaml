# AWS EKS profile for the AWS Load Balancer Controller.
# Supply the customer domain and ACM certificate ARN in a private override file.
# Supply approved subnets, security groups and inbound CIDRs when required.
ingress:
  className: alb
  controllerType: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # SCIM requires TLS 1.3 on the backend connection.
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
tls:
  enabled: true
