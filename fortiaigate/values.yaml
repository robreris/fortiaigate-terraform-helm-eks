# Default values for fortiaigate.
# This is a YAML-formatted file.
# Declare variables to be substituted into your templates.
#
# IMPORTANT: This chart uses Bitnami PostgreSQL and Redis charts as dependencies.
# For advanced configuration options beyond what's shown here, refer to:
# - PostgreSQL: https://github.com/bitnami/charts/tree/main/bitnami/postgresql#parameters
# - Redis: https://github.com/bitnami/charts/tree/main/bitnami/redis#parameters

global:
  security:
    allowInsecureImages: true

  # global.licenses IS GONE. Licences were a map of node name -> .lic file: the
  # chart mounted them as a ConfigMap and pinned every pod to those nodes.
  # A licence now covers the DEPLOYMENT and is uploaded through the admin API
  # (POST /api/v1/admin/licenses), which stores it in the database — so there
  # is nothing to template, nothing to mount, and no node list to pin to.
  #
  # A fresh install therefore carries NO licence values at all. That is also
  # what makes the chart installable out of the box: with the map left empty
  # the rendered nodeAffinity had an empty `values`, which Kubernetes rejects.

# FortiAIGate Global Configuration
fortiaigate:
  # Common image configuration
  image:
    # Specify your container registry address and image tag.
    # Example:
    # repository: 192.168.0.1:5000
    # tag: V8.0.3-build6207
    repository: ""
    tag: "V8.0.3-build6207"
    pullPolicy: IfNotPresent
    pullSecrets: []

  # Scheduling supplied by Terraform for the tainted GPU node group.
  gpuWorkloadPlacement:
    nodeSelector: {}
    tolerations: []

  # Global GPU configuration
  gpu:
    enabled: true  # Set to false to run on non-GPU nodes
    # Which card the engines run on, by the name of a tuning profile the
    # chart ships in files/gpu-profiles.yaml: rtx-pro-6000, b200. The
    # profile sizes every GPU-bound knob that is left EMPTY below — Triton's
    # DLP instances per card and its CPU, vLLM's --max-num-seqs /
    # --api-server-count / --block-size and CPU, the dispatcher's two GPU
    # scan-queue sizes — and a knob you set yourself wins over it. Empty, or
    # a name the chart does not know, is the `default` profile, which is the
    # RTX PRO 6000 tuning. For a card that is not listed, pick the closest
    # listed one or set the knobs by hand. `helm get notes <release>` prints the profile in use and where
    # each knob came from.
    type: ""

  # Existing Secret (key "internal-token") for FAIG_INTERNAL_TOKEN, the
  # platform's service secret: mcp-gateway signs relay sessions with it and
  # presents it to its companions, plugin-adapter presents it, and
  # action-guard and observability check it (FAIG_MCP_ADMISSION_KEY). Empty =
  # a Secret the chart generates and keeps stable across upgrades
  # (templates/internal-token-secret.yaml).
  internalTokenExistingSecret: ""

  # Update strategy for all Deployment workloads (api, webui, llm-gateway, logd, triton, scanners).
  # Does NOT apply to the license-manager DaemonSet, which always uses RollingUpdate.
  #
  # "RollingUpdate" (default): starts new pods before terminating old ones — zero downtime,
  #   but requires spare capacity. On GPU-constrained nodes, the new Triton pod will be stuck
  #   Pending waiting for a GPU still held by the old pod, causing a deadlock.
  # "Recreate": terminates all old pods first, then starts new ones — brief downtime during
  #   upgrade, but safe when GPU resources are exclusive and there is no spare capacity.
  updateStrategy: RollingUpdate  # RollingUpdate or Recreate

  # Global environment variables
  env:
    logLevel: "INFO"

  # Failure policy — deployment-wide pins for the three knobs that decide how
  # the gateway treats a failing upstream call. Consumed by BOTH the
  # llm-gateway and the api pods (like env.logLevel above, which is why it
  # sits here and not under llmGateway.env): the gateway applies the policy on
  # every request, and api's manual Check Health sends failThreshold attempts
  # with the same cooldown, so the two must read the same numbers.
  #
  # Vocabulary. Two of these are easy to confuse — the "retries before a model
  # is taken out of rotation" number is failThreshold, NOT retryTimes:
  #
  #   retryTimes       upstream RETRIES per request across a model's credential
  #                    pool. The gateway makes retryTimes + 1 attempts before it
  #                    enters the fallback chain. 0 is legal = one attempt. This
  #                    is NOT "retries before a model is taken out of rotation".
  #   failThreshold    consecutive failures on one (credential, model) pairing
  #                    before its circuit opens and the pairing leaves rotation
  #                    for the cooldown. This IS the "retries before a model is
  #                    taken out of rotation" number, and the number of attempts
  #                    a manual Check Health sends. Minimum 1.
  #   cooldownMinutes  minutes an open circuit stays open. Minimum 1.
  #
  # Precedence: a Helm pin here > the org's Runtime Defaults document
  # (GET/PATCH /api/v1/settings/runtime-defaults) > the documented defaults
  # (retryTimes 3 / failThreshold 3 / cooldownMinutes 5). Empty = not pinned:
  # the org document governs and an admin edits it through the API. A pinned
  # knob overrides the org document deployment-wide: GET reports the pinned
  # value and lists the field under deploymentManaged, and a PATCH naming that
  # field is refused with 422. Per-model overrides — the Retry / Cooldown a
  # fallback rule used to set on its primary — were retired 2026-09-28 (#91);
  # there is no per-rule or per-model level any more.
  #
  # Takes effect when the llm-gateway and api pods restart, which a helm
  # upgrade that changes any of these values does (it changes the pod env and
  # rolls both deployments). No config recompile is involved: the pin is
  # overlaid in-process on every snapshot the pods load. Rendered as
  # FAIG_FAILURE_POLICY_{RETRY_TIMES,FAIL_THRESHOLD,COOLDOWN_MINUTES} only
  # when set (a literal 0 IS set; "", a blank string and null are not), as
  # plain digits whatever the YAML spelling (a file's 1000000 does not become
  # "1e+06"). A malformed pin — not a whole number, outside int32,
  # retryTimes < 0, failThreshold or cooldownMinutes < 1 — or a key here other
  # than these three fails the RENDER (helm install / upgrade / template),
  # naming the key, so the running pods are kept; the pods apply the same rule
  # at startup for an env that reaches them another way. Never a silent
  # fallback to the org document.
  #
  # api.runtimeDefaults.{failThreshold,cooldownMinutes}, which a reverted
  # mechanism briefly shipped (Helm BELOW the org document), is refused at
  # render time when set: move the value here, where it OVERRIDES the org
  # document instead.
  failurePolicy:
    retryTimes: ""        # empty = not pinned; 0 is a legal pin (one attempt)
    failThreshold: ""     # empty = not pinned; >= 1
    cooldownMinutes: ""   # empty = not pinned; >= 1

# API Service Configuration
api:
  replicas: 1

  # Read-only hook: fail an incompatible upgrade BEFORE replacing running pods.
  # Known legacy databases need scripts/schema-upgrade-k8s.sh first. Do not
  # disable this to bypass a bridge prerequisite. --no-hooks bypasses Helm's
  # protection and is unsupported for database-bearing upgrades.
  schemaPreflight:
    enabled: true
    timeoutSeconds: 300

  # Existing Secret (key "master-key") holding the master key that seals
  # credential secrets at rest. Empty = fall back to a Secret the chart
  # generates and keeps stable across upgrades (templates/master-key-secret.yaml) — a fresh
  # install always gets real encryption, with no manual secret-creation step.
  # Set this only to bring your own key (e.g. to share one already used
  # elsewhere). Every service that writes or resolves credential values must
  # see the SAME key — see fortiaigate.masterKeySecretName in _helpers.tpl.
  masterKeyExistingSecret: ""

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 1Gi

# Web UI Configuration
webui:
  replicas: 1

  # Per-service image tag override. Leave empty to inherit fortiaigate.image.tag.
  # Set via `--set webui.image.tag=<tag>` to update ONLY webui without disturbing
  # the other services that still reference the shared fortiaigate.image.tag.
  image:
    tag: ""

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Core Service Configuration
llmGateway:
  replicas: 1

  env:
    # In-flight request admission budget, in bytes. Empty = automatic (a
    # quarter of resources.limits.memory below).
    maxInflightBytes: ""
    # Bifrost worker-pool size for concurrent upstream LLM calls; requests
    # beyond it queue inside Bifrost (not an admission limit).
    poolSize: 1000
    # Idle-connection pool size for the Redis log-stream sink.
    logRedisPoolSize: 64
    # Timeout in seconds for requests to upstream LLM providers.
    upstreamLlmRequestTimeout: 600
    # PoC default: skip certificate/hostname validation for outbound LLM
    # providers AND LLM passthrough relays. Set verify: true to enable it.
    # Private CA roots can be provided through the standard SSL_CERT_FILE
    # trust bundle; internal workload mTLS is independent and stays enforced.
    upstreamTls:
      verify: false
    # Let the gateway dial upstream endpoints on private (RFC 1918) networks.
    # Needed for any endpoint override onto the cluster network; false gives
    # Bifrost's own SSRF posture for a deployment with no private upstream.
    upstreamAllowPrivateNetwork: true
    # Set true to filter RFC1918/loopback targets for LLM passthrough relays.
    # Also set upstreamAllowPrivateNetwork: false for normal LLM traffic.
    passthroughRefusePrivateTargets: false
    # Seconds an idle connection to an integration's own Base URL (a
    # self-hosted vLLM, an on-prem proxy) stays pooled for reuse. Keep it
    # BELOW that server's keep-alive timeout: uvicorn, which fronts vLLM,
    # SGLang and LiteLLM, closes idle connections after 5s (gunicorn +
    # UvicornWorker after 2s). Above it, requests are written onto
    # connections the server already closed and answer 502. Vendor-hosted
    # endpoints are unaffected.
    upstreamBaseUrlKeepaliveTimeout: 4
    # The in_stream response scan's window, in CHARACTERS
    # (docs/workflows/in-stream-scan.md). Every scan judges all the answer so
    # far; the pair only paces the scans: one fires once the window — the
    # text not yet released, the hold-back of the previous scan included —
    # holds windowChars, and holdbackChars of its tail are kept back and
    # judged again with the next scan, so a value cut by a scan edge is
    # caught whole; the policy judge reads the whole answer as context. The
    # first text reaches the client after about windowChars of model output,
    # then about windowChars minus holdbackChars per scan. Empty = the
    # binary's defaults (1024 / 256). Floors 100 / 100 (a value below falls
    # back to the defaults with a startup WARN); a hold-back above half the
    # window is clamped to half, with a WARN. An org may override the window
    # through its Runtime Default stream_scan_buffer_chars (the API field
    # streamScanBufferChars; 0 = unset): set, it governs that org's streams,
    # with this hold-back clamped to half of it. fabric.inStream below is the
    # same pair for FortiGate streams. Renamed from chunkChars / overlapChars
    # on 2026-11-05 (chunkBytes / overlapBytes before 2026-11-01); the old
    # keys are ignored, and helm prints a warning.
    inStream:
      windowChars: ""
      holdbackChars: ""

  resources:
    limits:
      cpu: 1000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

# The plugin adapter: the FortiAIGate end of the Claude Code plugin
# (docs/8.0.3/plugin/plugin-faig-interface.md). The plugin sends it a prompt,
# a tool call, a tool's output and the model's answer (whole or streamed); it
# has the guardrail dispatcher apply the verified managed policy. Always
# deployed. Normal clients use the Auth-managed MCP endpoint; the private
# adapter has no public ingress. The development virtual-key path needs
# legacyDevAuth.
pluginAdapter:
  # Ordinary runtime uses the Auth-managed MCP gateway and private HTTPS.
  # The direct virtual-key path (X-FAIG-Virtual-Key, judged by the key's
  # policies) needs this explicit lab-only opt-in.
  legacyDevAuth: false
  managedAuth:
    organizationId: ""
    # Existing Secret: tls.crt/tls.key for plugin-adapter's server certificate.
    # The server certificate must cover its DNS. No client CA is needed.
    # Optional with tls.enabled: unset, the adapter serves the external
    # certificate (tls.cert), as api and llm-gateway do, and with tls.enabled
    # false the one Auth issues (auth.enabled). Required only with neither.
    tlsSecretName: ""
  # More than one replica needs the chart's Redis (redis.enabled): the
  # replicas keep each conversation's redaction state, and the answers being
  # streamed, there, and any replica serves any request. One replica keeps
  # the answers being streamed in its own memory.
  replicas: 1
  # How long a conversation's redaction vault is kept after its last scan (a
  # Go duration). Every scan resets the clock; it only has to outlast the wait
  # for the model's answer, which is scanned against the vault and gets the
  # originals back in place of the placeholders.
  vaultIdle: "10m"
  # The adapter's own limit on one scan, in seconds, when the plugin's request
  # names no timeout_ms.
  scanTimeoutSeconds: 30
  # Add a preview of the scanned text to each scan's log line (off: sizes and
  # verdicts only).
  logContent: false
  # Each scan's record goes to the traffic log (Redis, then LogD), where the
  # scans of one turn are one row beside the gateway's requests. false: the
  # scans are logged on the adapter's stdout only.
  trafficLog: true
  env:
    # The streamed answer's scan window, in CHARACTERS — the gateway's pair
    # and rules (llmGateway.env.inStream above,
    # docs/workflows/in-stream-scan.md): every scan judges all the answer so
    # far; one fires once the text since the last cut holds windowChars, and
    # holdbackChars of its tail are kept back and judged again with the next.
    # The first text reaches the person after about windowChars of model
    # output, so a SMALLER window shows the answer sooner at the cost of more
    # scans. Empty = the binary's defaults (1024 / 256), floors 100 / 100; a
    # hold-back above half the window is clamped to half. Renamed from
    # chunkBytes / overlapBytes (bytes, 4096 / 1024) on 2026-11-05; those
    # keys are ignored (helm prints a warning).
    inStream:
      windowChars: ""
      holdbackChars: ""
    # The memory admission budget, in bytes, as llm-gateway's
    # (llmGateway.env.maxInflightBytes): a scan waits, before its body is
    # read, until the request bodies in flight fit in it. EMPTY (the default)
    # = a quarter of resources.limits.memory below; a number is an absolute
    # override.
    maxInflightBytes: ""
  resources:
    limits:
      cpu: 5000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 512Mi

# plugin-adapter-mcp — the Claude Code plugin's MCP endpoint (the Connector
# FortiAIGate AgentGuard, /api/v1/plugins/claude-code/mcp). It forwards each
# scan, with the caller's credential, to plugin-adapter. Always deployed as a
# second container in plugin-adapter's pod: pluginAdapter.replicas applies.
pluginAdapterMcp:
  # Auth workload Secret (tls.crt, tls.key, ca.crt) plugin-adapter resolves
  # employee tokens with. Empty uses the automatic Auth identity bundle;
  # provide an existing Secret when using external Auth.
  workloadTlsSecretName: ""
  env:
    # Memory admission budget in bytes; empty = a quarter of the memory limit.
    maxInflightBytes: ""
  # This container's own; the pod asks for the sum with pluginAdapter's.
  resources:
    limits:
      cpu: 5000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 256Mi

# inference-hooks — FortiAIGate's endpoint for Anthropic's Inference hooks
# (Claude Enterprise). Anthropic's servers POST each signed frame (a prompt, a
# tool call) to https://<host>/inference-hooks/claude/v1/<endpoint id> and
# get allow or deny, which the policies of the person's key decide. The
# endpoint, the signing secret and the failure rules are the card below
# (inferenceHooks.card). Off by default. The image is
# <fortiaigate.image.repository>/inference-hooks with the deployment's tag
# (fortiaigate.image.tag): no tag of its own.
#
# PREREQUISITE: Anthropic checks the certificate of the hook URL against the
# PUBLIC CA trust store, and calls a public host name with an IPv4 address, on
# port 443, with no redirect. The hook path has the platform's certificate
# (tls.cert / tls.key): the chart's default, self-signed, fails claude.ai's
# Test connection, so make the platform's certificate a public CA's.
inferenceHooks:
  enabled: false
  # The server holds no state of its own: the replay cache, the conversation
  # cursor and the Observability session ids are in the shared Redis, so any
  # replica serves any frame. Without the chart's Redis (redis.enabled=false)
  # they are held in the process and the render refuses more than one replica.
  replicas: 2
  # The card, required with enabled. In this release the chart sets it; its
  # console page and API come in a later release. The signing secret and the
  # header value go to the Secret inference-hooks-card; a change rolls the
  # pods.
  card:
    # The last part of the hook URL that you enter in claude.ai:
    # https://<host>/inference-hooks/claude/v1/<endpointId>. 32 lowercase
    # hex characters: `openssl rand -hex 16`. Required.
    endpointId: ""
    # The FortiAIGate organization of the frames. Empty = the deployment's
    # only organization (with two or more, each frame gets 503).
    organizationId: ""
    # The signing secret that claude.ai reveals (Request signing), whsec_...
    # Required. It will move to the card's API configuration (the console) in
    # a later release.
    signingSecret: ""
    # The custom request header that you add in claude.ai. An empty value =
    # no custom header: the signature alone authenticates a frame. It will
    # move to the card's API configuration (the console) in a later release.
    requestHeader:
      name: X-FAIG-Hook-Token
      value: ""
    # The Anthropic organization (tenant_id) a frame must name. Empty = any.
    tenantId: ""
    # A person that FortiAIGate does not know: deny, fallback_key (the
    # SERVICE key fallbackKeyId judges) or allow (unscanned).
    unmappedActor: deny
    fallbackKeyId: ""
    # A redaction that a policy asks for: deny or alert.
    redactionVerdict: deny
    # What FortiAIGate answers when it cannot judge a frame (a scanner or
    # Action Guard failed, or scanTimeoutMs below ended):
    #   webhook_failure  an error, so the failure handling set in claude.ai
    #                    decides (Block, Allow or Shadow mode); repeated
    #                    errors trip Anthropic's circuit breaker.
    #   deny             fail closed.
    #   allow            fail open: the request goes on unscanned.
    failMode: webhook_failure
    # How long FortiAIGate may take to scan one frame and answer, in ms
    # (100 to 10000). Keep it below the verdict timeout set in claude.ai
    # (default 5000 ms), which also covers the network. A frame not judged in
    # time is answered by failMode above.
    scanTimeoutMs: 3500
  env:
    # The memory admission budget, in bytes, as plugin-adapter's
    # (pluginAdapter.env.maxInflightBytes): a frame waits, before its body is
    # read, until the bodies in flight fit in it. EMPTY (the default) = a
    # quarter of resources.limits.memory below; a number is an absolute
    # override (FAIG_MAX_INFLIGHT_BYTES).
    maxInflightBytes: ""
    # Any other key is an environment variable of the server, rendered
    # verbatim, e.g.
    #   INFERENCE_HOOKS_CARD_REFRESH: "30s"
    # INFERENCE_HOOKS_GATEWAY_HOSTS set here replaces the chart's
    # (ingress.host). A variable the template sets otherwise is refused:
    # set its value instead.
  # The hook route: its own Ingress object, rendered with the server, for
  # /inference-hooks (Prefix, the path unchanged: the frames and the health
  # paths) to the Service inference-hooks:8768. No switch: without it the
  # platform's catch-all / would send Anthropic's frames to the console. It
  # shares the platform ingress, as auth's routes do: its class
  # (ingress.className / controllerType), its host (ingress.host) and its
  # certificate (tls.cert / tls.key, Secret fortiaigate-external-tls-secret;
  # ACM on an ALB). Anthropic checks that certificate against the PUBLIC CA
  # trust store: a self-signed one fails Test connection. Its own are its
  # annotations: a 64m body, a 15 s read timeout and the source-address
  # restriction below.
  ingress:
    # The client addresses that may reach /inference-hooks (the frames and the
    # health paths). The ingress answers any other address 403, before
    # FortiAIGate sees the request. It only limits who can reach the server: a
    # frame from an address in the range is still checked (its signature) and
    # scanned like any other.
    # Empty by default: any address can reach the route.
    # Recommended: set it to Anthropic's range, after you make sure that the
    # ingress controller sees the original source address of the clients
    # (externalTrafficPolicy: Local, or PROXY protocol, on the controller's
    # Service). With Cluster, the Kubernetes default, the controller sees an
    # internal address instead and refuses every frame, Anthropic's too.
    #   sourceRanges:
    #     - 160.79.106.0/24
    # Rendered as nginx's whitelist-source-range annotation or an ALB's
    # inbound-cidrs; on Traefik, add an ipAllowList Middleware (annotations).
    sourceRanges: []
    # Extra annotations, merged OVER the chart's (yours win key by key), e.g.
    # the ipAllowList Middleware that restricts the addresses on Traefik:
    #   traefik.ingress.kubernetes.io/router.middlewares: <namespace>-<name>@kubernetescrd
    annotations: {}
  resources:
    limits:
      cpu: 5000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Guardrail data plane.
guardrail:
  # Extra inference engines whose real accelerator inventory this dispatcher
  # must meter. Use when a deployment shares an engine outside this chart.
  # Each reporter serves /gpu; each metrics endpoint serves /metrics. Never
  # configure an endpoint that invents an empty inventory or hides a GPU.
  externalMetering:
    reporterEndpoints: []
    metricsEndpoints: []
    servicePairs: []
  env:
    # The scan cap: the most of one block, in o200k_base TOKENS (the policy
    # model's own vocabulary, the count tiktoken gives), that any detector —
    # regex, DLP entity detection and Natural Language policy judging —
    # reads. A longer block is judged up to the cap and the rest is NOT
    # scanned; the traffic log records how much. 8192 is about 35,000
    # characters of English prose, 18,000 of code or 12,000 of Chinese, and
    # an 8192-token text fits one policy model call on every GPU profile with
    # the shipped rule packs. Only the guardrail dispatcher reads it; fabric
    # tells a FortiGate the cap in characters, 4 a token (32768 at 8192).
    #
    # It also sets what the GPU scan queues charge one block, at 4 bytes a
    # token: keep GUARDRAIL_DLP_QUEUE_CHARS and GUARDRAIL_POLICY_QUEUE_CHARS
    # (below) at least ~20x that (655,360 at 8192), or one long request can
    # fill a queue on its own and others get HTTP 429. Raising it scans more
    # of a long document and costs GPU in proportion, and a fabric /scan2
    # stream may hold 4x it in characters: past about 32768, raise
    # fabric.resources.limits.memory too (fabric warns at start when its
    # streams can outgrow it). Hard ceiling 131072, the policy model's full
    # context: a larger value is clamped down; an empty or invalid value means
    # 8192. Replaces maxScanChars (characters), retired on 2026-11-05: a
    # maxScanChars still set is ignored (helm prints a warning).
    maxScanTokens: "8192"
    # Scanner detection-cache size, in bytes. Empty = automatic; "0" disables.
    # One knob for both scanner pods, each keeping its own cache against its
    # own memory limit, both keyed per MODEL WINDOW: dlp-scanner remembers
    # GLiNER predictions per Triton window, policy-guard remembers policyGuard
    # verdicts per window of a (rules, tool definition) prompt — the tool
    # list only. A text that grows by appending (a streamed answer scanned as
    # all the content so far, an agent's history) re-infers only its last
    # window. The conversation policy-guard judges as one combined text is
    # left to vLLM's prefix cache (vllm.extraArgs below), not kept here.
    cacheMaxBytes: ""
    # Max size of one scan request, in bytes; a larger request gets HTTP 413.
    # The plugin adapter's body limit follows from it (its base64 size plus
    # 64 KiB). Above 47 MiB, that body limit is larger than the ingress's
    # 64m proxy-body-size, which must then be raised to match. With
    # pluginAdapterMcp, at most 12533760 (the render fails above): the
    # adapter's body limit must stay within plugin-adapter-mcp's 16 MiB.
    maxRequestBytes: "10485760"
    # What `short_circuit` means for a scan that does not set it — which is
    # every scan the gateway sends, so this is what decides it in practice. A
    # caller that does set the field overrules this, either way.
    #
    # On: stop scanning once a DENY is folded. The dispatcher checks
    # cheapest-first — character screening, then the in-process regex stage,
    # then DLP and policyGuard on the GPU — so a deny from a cheap check skips
    # the GPU calls it has already made moot.
    #
    # The VERDICT is identical either way. What changes is that the skipped
    # detectors report SHORT_CIRCUITED and contribute no findings, so a denied
    # request's traffic-log violation details name what denied it and not what
    # went unchecked. Set false for deployments that must record every detector
    # on every request.
    shortCircuitDefault: true

  # Traffic normalization: decode encoded content (base64, percent-encoding,
  # \uXXXX, \xXX) before scanning, so detectors see the real text. Suspicious-
  # character screening is configured per guardrail in the UI, not here.
  # Invalid values prevent the guardrail pod from starting.
  trafficNormalization:
    decode:
      # Decode encoded content before scanning.
      enabled: true
      # Max stacked encodings to decode (1-5; larger values are clamped).
      maxLayers: 2
      # When content is still encoded at the maxLayers cap: "deny" rejects the
      # request, "alert" logs and scans the partially decoded text.
      limitAction: alert

  # Each component takes: replicas, an optional `env:` map (extra NAME: value
  # environment variables), and `resources:` block
  guardrail:            # dispatcher front door
    replicas: 1
    # Scan-queue limits per pod, in characters of in-flight content. Over
    # capacity a scan is rejected with HTTP 429 (retryable). "0" = no limit.
    env:
      # Characters normalized and regex-scanned at once (CPU work). Keep it
      # above maxRequestBytes: at 64 MiB one request of ASCII is 67M
      # characters, two thirds of this queue, so two such requests serialize
      # and a third waits — acceptable for the one caller that sends them
      # (the inference-hook adapter, whose bodies are about 10 MB in
      # practice); raise it if such requests queue.
      GUARDRAIL_PRECHECK_QUEUE_CHARS: "100000000"
      # Characters in flight to each GPU scanner; keep the two values equal.
      # Size to your GPU. EMPTY (the default) takes the fortiaigate.gpu.type
      # profile's value (files/gpu-profiles.yaml; 2000000 in `default`); a
      # number here wins over the profile. Raise it
      # for a faster GPU, lower it for a slower one. Too high and queued scans
      # time out; too low and scans get HTTP 429 under load. "0" = no limit.
      GUARDRAIL_DLP_QUEUE_CHARS: ""
      GUARDRAIL_POLICY_QUEUE_CHARS: ""
      # Max scan requests open at once.
      GUARDRAIL_MAX_INFLIGHT_SCANS: "1000"
      # Max seconds for one scan, waiting included. Size it, and the
      # *_QUEUE_CHARS windows above, against your clients' patience: a scan a
      # client gives up on is logged with the keyword `scan_abandoned`.
      GUARDRAIL_SCAN_BUDGET_SECONDS: "600"
    # Memory is bounded by text in flight (the queue caps above), not by
    # detectors: redaction and placeholder restore keep only a small map per
    # scan. CPU is what grows with traffic (normalization + regex per char).
    resources:
      limits:
        cpu: "5000m"
        memory: "4Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"

  dlpScanner:
    replicas: 1
    env:
      CHUNK_SIZE: "512"
      CHUNK_OVERLAP_SIZE: "128"
      # DLP_LOG_SCAN_TEXT: "true"  # DEBUG only: log each judged block's text as scanned
    # About 1Gi in use while scanning a block at the 131072-token
    # maxScanTokens ceiling, far less at the default; the detection cache may
    # add up to 25% of the limit on top over time (1Gi at the 4Gi below).
    resources:
      limits:
        cpu: "5000m"
        memory: "4Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"

  policyGuard:
    replicas: 1
    # The model endpoint comes from the `vllm` section below; when vLLM is not
    # running, POLICY detectors fail closed. Tuning, all optional:
    env:
    #   POLICYGUARD_CONSTRAIN_OUTPUT: "false"   # force the answer into the verdict grammar
    #   POLICYGUARD_STRICTNESS: "medium"        # 1-5, or lowest|low|medium|high|highest
    #   POLICYGUARD_THRESHOLD: ""               # unset = 0.5 (VirtueAI's gate); "0" turns the gate OFF
    #   POLICYGUARD_VLLM_TIMEOUT_SECONDS: "60"  # per model call
    #   POLICYGUARD_CHUNK_TOKENS: ""            # cap on the text per model call, in tokens; unset = all the context the rules leave
    #   POLICYGUARD_CHUNK_OVERLAP_TOKENS: ""    # tokens consecutive windows share; unset = a quarter of the window
    #   POLICYGUARD_TOKENIZER_FILE: ""          # unset = the policyGuard tokenizer in the image; "none" = estimate instead
    #   POLICYGUARD_MAX_RULE_DEFINITION_CHARS: "48000"  # cap on one detector's rendered rules
    #   POLICYGUARD_CONTEXT_TOKENS: ""          # model context in TOKENS; unset = learned from vLLM
    #   POLICYGUARD_CONCURRENCY: "8"            # model calls in flight per scan
    #   (the verdict cache is sized by guardrail.env.cacheMaxBytes above, not here)
    #   POLICYGUARD_MAX_TOKENS: "8"             # answer cap
    #   POLICYGUARD_VLLM_API_KEY: ""            # when vLLM runs with --api-key
    #
    # CONSTRAIN_OUTPUT is off by default. The model answers in the verdict
    # format on its own, and forcing the format hides the one signal that says
    # the wrong model is being served: an answer that cannot be parsed fails
    # the detector closed and names the cause, while a forced answer looks
    # valid whatever produced it. Turn it on only for a model that needs it.
    #
    # STRICTNESS is the biggest lever on the false-positive rate: the same text
    # can be safe at 1 and unsafe at 5. It applies only to detectors whose own
    # policy does not set one; without either, scanning is at 3 (medium).
    #
    # THRESHOLD only tightens. A hit needs the model's "unsafe" verdict AND
    # P(unsafe) STRICTLY ABOVE THRESHOLD, so it can only ever subtract hits; a
    # "safe" verdict is never flagged whatever its probability.
    #
    # UNSET IS 0.5 AND IT IS LIVE (changed 2026-09-16). That is VirtueAI's
    # shipped default for this checkpoint, and it bites here because P(unsafe)
    # is their raw measure: the sampled verdict token's own probability. A
    # greedy "unsafe" at 0.45, with the rest of the mass on other continuations,
    # is now suppressed where it used to be a hit.
    #
    # "0" TURNS THE GATE OFF and restores the previous behaviour, where every
    # verdict the model called unsafe was a hit. That is the rollback lever if
    # the gate is found to cost recall; it needs no image rebuild.
    #
    # Raising it FAILS OPEN: every increment suppresses hits the model flagged,
    # so a careless 0.95 quietly stops enforcing while still reporting healthy.
    # A value over 1 could never be cleared, so it is repaired to 0.5 rather
    # than honoured.
    #
    # WINDOWS ARE SIZED IN THE MODEL'S TOKENS, with the policyGuard
    # checkpoint's own tokenizer, which the guardrail-scanner image ships.
    # Longer content is split into overlapping windows and every window is
    # judged. Each model call carries the detector's whole rules beside one
    # window, so a window is as long as the context leaves beside them:
    # vllm.maxModelLen, less the rules, less 21 tokens of template and answer.
    # On the RTX PRO 6000 and B200 (a 128K context) that is ~126000 tokens
    # beside a typical shipped pack, so a scan's content is judged whole; at
    # a 16K context ~14000, and ~9200 beside the largest pack. Nothing here
    # has to agree with maxModelLen: policy-guard reads it from vLLM, so
    # raising or lowering it moves the windows with it.
    #
    # CHUNK_TOKENS caps a window below that, for calls the server can batch
    # more of at once (a long text then costs more calls); unset, there is no
    # cap but the context.
    #
    # CHUNK_OVERLAP_TOKENS is what consecutive windows share, so a violation on
    # a boundary is still seen whole: a quarter of the window when unset. SET
    # LARGER THAN HALF THE WINDOW, IT IS REDUCED TO HALF: windows may share at
    # most half of one, or each advances by so little that nearly every window
    # is judged twice. A smaller value is always kept as set.
    #
    # TOKENIZER_FILE: at start, once vLLM answers, policy-guard has it tokenize
    # a test text and compares the result with its own tokenizer's. If they
    # differ — the image's tokenizer is not the served checkpoint's — the log
    # says so and windows are ESTIMATED instead (one token per CJK character,
    # one per three bytes of anything else), as they are with "none". Estimated
    # windows are smaller than the context allows, so a long text costs more
    # calls, but it is still scanned. Either way a window the server refuses
    # as too long is halved and re-judged. The tokenizer takes about 230 MiB of
    # this pod's memory.
    #
    # MAX_RULE_DEFINITION_CHARS bounds one detector's rendered rules. A
    # detector over it is reported as FAILED rather than scanned against a
    # truncated policy: reduce its rules or shorten their descriptions. Every
    # token of rules is a token less of window, so larger rules mean more calls
    # per document. Raising the cap means raising vllm.maxModelLen to match —
    # rules too long for the context are the one overflow that splitting the
    # text cannot rescue.
    #
    # The cap counts CHARACTERS and the model's limit is in TOKENS, and dense
    # CJK costs about five times more tokens per character than Latin, so a
    # policy authored in Chinese can pass this cap and still not fit. That case
    # is caught by a PRE-FLIGHT: when the rules' token count (estimated, where
    # the tokenizer is off) says they might not fit, the scanner asks the
    # server once (a one-character text under the full rules) before cutting
    # any window, and fails the detector with the rules named. One call, and
    # the server's own refusal is the authority, so a count can never fail a
    # detector that works. The context it believes is on the "policyGuard
    # model endpoint ready" line (from /v1/models, or
    # POLICYGUARD_CONTEXT_TOKENS, or an assumed 16384). The server's figure is
    # re-read every minute; a change is logged as "policyGuard model context
    # changed".
    resources:
      limits:
        cpu: "5000m"
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"

# Triton Inference Server Configuration
# REQUIRED: serves the DLP model on the GPU with dynamic batching.
# Scanners depend on Triton for inference (thick client, thin server architecture)
triton:
  replicas: 1

  # Instances of the DLP model Triton runs on EACH of its GPUs. They run at
  # the same time, so while one is between batches another keeps the GPU
  # working. Raise it when DLP scans queue under load, and judge the result by
  # DLP throughput, not GPU utilization, which reads high well before the
  # card is full. EMPTY (the default) takes the fortiaigate.gpu.type profile's
  # value (files/gpu-profiles.yaml): 3 in `default`, the RTX PRO 6000 (96 GB)
  # tuning, tested sharing the card with vLLM. A number here wins over the
  # profile.
  # Every instance:
  #   - holds its own copy of the model: up to about 3 GiB of GPU memory, and
  #     more host memory against resources.limits.memory below. On a card
  #     shared with vLLM, Triton has only the part vLLM leaves free
  #     (1 - vllm.gpuMemoryUtilization): room for 1 on a 24 GB card.
  #   - keeps about one CPU core busy while it runs. Keep
  #     resources.limits.cpu below at least (instances x gpuCount) + 1 cores,
  #     or CPU throttling leaves the GPU idle. The default limits cover 3 on
  #     one card.
  # Start-up is slower with more instances: each loads its own TensorRT
  # engine after the first one builds it.
  dlpInstancesPerGpu: ""

  # Largest batch Triton may assemble for the DLP model. The scanner sends
  # its windows one per request; Triton's dynamic batcher groups them. ONE
  # number sets the whole batching contract in the model's config.pbtxt —
  # max_batch_size, the batcher's preferred_batch_size [half, whole], and
  # the TensorRT profile's opt (half x 512) and max (whole x 512) shapes — so
  # the four cannot disagree. EMPTY (the default) takes the fortiaigate.gpu.type
  # profile's value: 16 in `default` (the RTX PRO 6000 tuning); a number here
  # wins over the profile. Larger keeps a big card busy with more windows per
  # kernel launch and costs GPU memory per instance (the TensorRT engine is
  # built for the max shape); 1 turns batching off. Changing it restarts the
  # pod and rebuilds the engine.
  dlpMaxBatchSize: ""

  # Triton verbose logging: 0 = off. 1 logs every inference request, several
  # lines each, which costs throughput under load. For troubleshooting only.
  logVerbose: 0

  resources:
    limits:
      # EMPTY takes the fortiaigate.gpu.type profile's value (5000m in
      # `default`, enough for its 3 instances on one card); a quantity here
      # wins over the profile.
      cpu: ""
      memory: 25Gi
      # Cards per Triton pod. Triton runs dlpInstancesPerGpu instances of the
      # model on each card, so 2 doubles DLP throughput in one pod — but a
      # RollingUpdate then needs 2 spare cards for the surge pod; prefer more
      # replicas at gpuCount 1, or fortiaigate.updateStrategy: Recreate. Every
      # card counts for the licence.
      gpuCount: 1
      gpuResourceName: "nvidia.com/gpu"  # Can be overridden for MIG: nvidia.com/mig-3g.40gb
    requests:
      cpu: 1000m
      memory: 12Gi

# policyGuard vLLM server: the model behind Natural Language (POLICY)
# detectors. It runs when fortiaigate.gpu.enabled is true and replicas is 1,
# and needs a GPU of compute capability 8.0 or higher. There is no separate
# `enabled` flag. Where it runs is gpuAttach below: inside the Triton pods on
# Triton's card (shared; those pods are then named triton-vllm-server-...),
# or in pods of its own (dedicated).
#
# WHEN IT DOES NOT RUN, POLICY SCANNING FAILS CLOSED: every Natural Language
# detector is reported as failed and the gateway answers 503. Rules are never
# reported as enforced while nothing evaluates them. DLP and REGEX detectors
# are unaffected — to run without policyGuard, remove Natural Language
# detectors from the policies in use.
vllm:
  # 0 turns vLLM off. In shared mode (below) vLLM runs inside every
  # Triton pod (named triton-vllm-server-... there), so the number of
  # policyGuards is triton.replicas and this only switches it on (1) or off
  # (0). In dedicated mode it is the number of standalone vllm-server
  # pods, each needing gpuCount cards of its own.
  replicas: 1

  # The engine and model image tags ship with the chart and are not
  # configurable here; only the registry comes from
  # fortiaigate.image.repository.

  # Fraction of each GPU vLLM may use, weights included. Empty (the default)
  # follows the attachment mode below: 0.85 on a card of its own, 0.80 when it
  # shares the card with Triton (which takes about 3 GiB of it for each of its
  # triton.dlpInstancesPerGpu instances). The model
  # takes about 16.6 GiB before any KV cache, so on a 24 GB card that leaves
  # ~2.5 GiB or ~1.4 GiB of KV cache. Set a number to override — for a
  # time-sliced cluster the chart cannot recognise, for instance.
  #
  # Set too low, vLLM does not start: it needs room for the weights AND for at
  # least one request of maxModelLen tokens. A fortiaigate.gpu.type profile
  # may set it too (none of the shipped ones does): a number here wins over
  # the profile, and the profile over the mode.
  gpuMemoryUtilization: ""

  # Largest prompt one scan may send the model, in tokens (a detector's rules,
  # the content being scanned, and the verdict). It is also the policyGuard
  # WINDOW size: policy-guard reads it from vLLM and cuts each detector's
  # windows to fill what its rules leave of it (guardrail.policyGuard.env
  # above), so moving it moves the windows, with nothing else to re-check.
  # Larger windows let the model connect a reference to its referent across
  # more of a document, in fewer calls.
  #
  # It does not size the KV cache — gpuMemoryUtilization above does — so
  # raising it costs no extra memory, but vLLM will not start unless the cache
  # can hold one request of this length. Each window then holds up to this
  # many tokens of the KV pool while it is judged, so on a small card fewer
  # windows run at once (pool / max-model-len of them at full length);
  # POLICYGUARD_CHUNK_TOKENS caps windows below it without moving the server's
  # ceiling.
  #
  # EMPTY (the default) takes the fortiaigate.gpu.type profile's value
  # (files/gpu-profiles.yaml): 131072 (128K), the checkpoint's own maximum, on
  # the RTX PRO 6000 and B200, where the KV cache holds many requests that
  # long, so content is judged whole. A number here wins over the profile;
  # "0" sends no flag and vLLM takes the checkpoint's own maximum. vLLM
  # refuses more than that maximum. A 24 GB card cannot hold one 128K request
  # beside Triton (its KV cache holds ~54K tokens): set 16384 there.
  #
  # A values file copied from an earlier chart carries 16384 here, which keeps
  # winning on upgrade: empty it to take the card's profile.
  maxModelLen: 16384  # Keep the maintained EKS context size for shared GPUs.

  # How vLLM gets its GPU — one of three:
  #   auto (default): decided at install or upgrade from the cluster's nodes.
  #     With enough GPUs left over after triton-server for replicas x gpuCount,
  #     vLLM gets GPUs of its own (dedicated); otherwise it shares Triton's
  #     (shared). The chart's notes print the outcome. Needs permission to
  #     list nodes; rendered offline it assumes shared.
  #   shared: vLLM shares Triton's GPU — one Triton, one vLLM, one card, no
  #     extra licence, no cluster-level change (no time-slicing, MIG or MPS).
  #     Implemented as co-location: vLLM runs as a second container inside
  #     every Triton pod, on the card the kubelet gave Triton, so the pairing
  #     is guaranteed rather than discovered. The Deployment is then
  #     triton-vllm-server (pods triton-vllm-server-..., READY 2/2, label
  #     app=triton-vllm-server) instead of triton-server, so the pod list says
  #     which pods carry both engines; the Service names do not change.
  #     triton.replicas sets how many of each; both engines restart together
  #     when either's image or arguments change. Needs the NVIDIA container
  #     runtime as containerd's default, accepting NVIDIA_VISIBLE_DEVICES from
  #     unprivileged containers (the toolkit default), and triton.replicas of
  #     1 or more. Host memory per Triton pod grows by this block's resources
  #     below. The right mode for the common single-GPU deployment.
  #   dedicated: vLLM gets GPUs of its own — standalone vllm-server pods, each
  #     requesting gpuCount whole GPUs (resources.limits below) through the
  #     device plugin exactly as triton-server does, so the two engines land
  #     on different cards. For a deployment with more GPUs than Triton uses.
  #     On a node with no spare card the pod stays Pending.
  #   The earlier spellings — colocated and shared-runtime (both now shared),
  #   device-plugin (now dedicated) — are refused at render time, as is the
  #   retired sharedGpuDevices pin: in shared mode the card is Triton's by
  #   construction, there is nothing to pin.
  #
  # Neither mode limits VRAM; gpuMemoryUtilization above is vLLM's budget.
  gpuAttach: auto

  # Engine knobs the chart tunes PER CARD (files/gpu-profiles.yaml, picked by
  # fortiaigate.gpu.type). EMPTY takes the profile's value; a number here wins
  # over the profile. The raw flag in extraArgs below wins over both, and the
  # chart then renders no copy of its own.
  #
  # --max-num-seqs caps how many requests the server batches at once. The
  # profiles use 512, to avoid queuing calls inside vLLM.
  maxNumSeqs: ""
  # --api-server-count: API front-end processes in front of the engine. 2 in
  # `default` (the RTX PRO 6000 tuning), 4 on b200 (with the CPU to match,
  # below).
  apiServerCount: ""
  # --block-size: tokens per KV-cache block. Empty = the engine's own default
  # (16), right for the RTX PRO 6000; 128 on b200.
  blockSize: ""

  # Extra `vllm serve` arguments.
  #
  # --enable-prefix-caching PINS WHAT THE POLICY SCANNER ALREADY ASSUMES. A
  # detector's system prompt (its rendered rules, up to ~9.4k tokens) is
  # byte-identical for every window of every request that uses that detector,
  # and policy-guard is written around that prefill being paid once rather than
  # per window: see "so vLLM's prefix cache holds it after the first call" in
  # guardrail/scanner/backend/policyguard/policyguard.go. Since 2026-09-30 it
  # also carries the CONVERSATION across requests: policy-guard judges the
  # system text, turns, tool calls and tool results as one combined text that
  # grows by appending, so each request's windows repeat or extend the last
  # one's, and only the new tail should be prefilled. vLLM's V1 engine
  # enables it by default, so this changes nothing today. It is here so that a
  # default flipping on an engine bump fails LOUDLY, at a chart line somebody
  # edited, instead of silently as a latency regression nobody can source.
  # Both polarities are in 0.28's own engine arguments (CacheConfig:
  # --enable-prefix-caching / --no-enable-prefix-caching), so the flag is
  # accepted by the pinned image rather than crash-looping it.
  #
  # It is NOT the scanner's own verdict cache (cache.go), which keys on the
  # rules AND a tool definition's whole text, answers only exact repeats, and
  # serves the tool list alone. The two cover disjoint texts: the tool list is that one's, the
  # conversation and the response are this one's — repeats included.
  #
  # Whether it is actually HITTING is a pod-side question, not a chart one
  # ($POD is a triton-vllm-server pod in shared mode, a vllm-server pod in
  # dedicated mode; vLLM listens on 8100 in both):
  #   kubectl -n fortiaigate exec $POD -c vllm -- \
  #     curl -s localhost:8100/metrics | grep prefix_cache
  extraArgs:
    - "--enable-prefix-caching"

  # vLLM request logging, the counterpart of triton.logVerbose. 0 = off (the
  # default): start-up, model load, warnings, errors and the engine's periodic
  # throughput line under load still print, but nothing per request. 1 = every
  # request, as Triton's 1 does: the HTTP access line (which also lists every
  # /health probe, several a minute), a "Received request" line with the
  # sampling parameters, and a "Generated response" line with the model's
  # verdict text and finish reason. The prompt text is logged at neither
  # level (vLLM prints it only at its DEBUG logger level, which the chart does
  # not set). For troubleshooting only: it costs throughput under load, and
  # "--max-log-len=N" in extraArgs above caps the logged verdict if needed.
  # Changing this restarts the pod (both engines in shared mode).
  logVerbose: 0

  # Model volume holds the served model; cache volume holds compilation
  # artifacts, so restarts skip the warm-up.
  modelVolumeSizeLimit: 20Gi
  cacheVolumeSizeLimit: 10Gi

  resources:
    limits:
      # EMPTY takes the fortiaigate.gpu.type profile's value: 4000m in
      # `default`, 8000m for the 4 API servers on b200. A quantity here wins
      # over the profile.
      cpu: ""
      # Sized for the LOAD WINDOW, not steady state. The model ships
      # encrypted and the serving container decrypts it into memory (sealed
      # memfds; nothing on disk), so until vLLM reports healthy the pod holds
      # the whole checkpoint in RAM beside vLLM's own footprint: ~13.8 GiB of
      # weights + ~3.5 GiB of vLLM for the pinned faig-models tag, ~17.5 GiB.
      # That memory is released at the first healthy answer, after which the
      # pod is back to vLLM alone. A limit below that peak is an OOMKilled
      # pod in a crash loop that never reaches Ready — raise it with the
      # model: model size + 5 GiB, rounded up.
      memory: 24Gi
      # Cards per vLLM pod when it has cards of its own (dedicated, or
      # auto resolving to it). More than 1 runs the model tensor-parallel
      # across them: more KV cache per card and faster calls, on identical
      # cards. Every card counts for the licence. Override gpuResourceName for
      # MIG, e.g. nvidia.com/mig-3g.40gb. Not used in shared mode, where
      # vLLM attaches every card of its Triton pod (triton gpuCount).
      gpuCount: 1
      gpuResourceName: "nvidia.com/gpu"
    requests:
      # EMPTY takes the profile's value, sized for guaranteed performance:
      # 3000m in `default` (the RTX PRO 6000 tuning), 7000m on b200.
      cpu: ""
      memory: 24Gi  # startup memory peaks at ~22Gi under current settings.

license_manager:
  # Two replicas. One is elected leader and does the write side — FortiGuard
  # polling, GPU metering, publishing the licence snapshot; both answer reads,
  # so a failover is invisible to callers. Anti-affinity is preferred rather
  # than required, so both still schedule on a single-node cluster.
  replicas: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  proxy:
    enabled: false
    ipAddress: ""
    port: 1080
    username: ""
    password: ""

# LogD Service Configuration
logd:
  replicas: 1

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# FortiGate integration: the fabric module (fabric/). FortiGates connect to it
# directly over HTTP/2 + TLS, register by serial, and, once an admin authorizes
# them on the WebUI's Fabric Connectors -> Device page, send prompts and model
# answers to be judged by the guardrails assigned to them.
# Interface: docs/8.0.3/fabric/technical-spec.pdf.
# On by default; it opens a port that FortiGates can reach (service below).
fabric:
  # Off by default in 8.0.3: set true to deploy the FortiGate integration, the
  # Deployment and Service `fabric`. Its image is the deployment's own,
  # <fortiaigate.image.repository>/fabric:<fortiaigate.image.tag>, like every
  # other module's; there is no per-module tag.
  enabled: false
  # Tested with 1. More also work: each replica keeps its own copy of the
  # device registry, kept in step by PostgreSQL NOTIFY.
  replicas: 1

  # How FortiGates reach port 8443 of the pod. The pod terminates the TLS
  # itself (it has to see the FortiGate's client certificate), so this is a
  # TCP path, never an HTTP Ingress.
  #   NodePort      (default) <any node IP>:<nodePort>. Needs nothing outside
  #                 this chart. Pin nodePort (30000-32767) before configuring a
  #                 FortiGate, because the port is typed into the device.
  #   LoadBalancer  its own address on `port`. Needs a LoadBalancer
  #                 implementation with a free address (e.g. MetalLB).
  #   ClusterIP     no outside path of its own: add externalIPs below, or pass
  #                 TCP through an existing controller. For ingress-nginx:
  #                 helm upgrade ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx \
  #                   --reuse-values --set tcp.8443=<namespace>/fabric:8443
  service:
    type: NodePort
    port: 8443
    nodePort: ""
    # Any type: node addresses that answer on `port` themselves, i.e.
    # <node IP>:8443 instead of a 30000+ NodePort. `port` must be free on each.
    externalIPs: []
    # LoadBalancer only.
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    # NodePort / LoadBalancer only: Cluster (the Kubernetes default) or Local.
    externalTrafficPolicy: ""
    annotations: {}

  # FortiGates are shown the Fortinet-issued certificate in the deployment's
  # licence as soon as one is installed — the only identity they can verify.
  # This is not configurable: the former `tls.source: file` and
  # `tls.existingSecret` are retired and refused. Until a licence is installed
  # they are shown the chart's internal pair, Secret fortiaigate-tls-secret,
  # which exists while tls.enabled (or the PostgreSQL / Redis TLS switch) is
  # on, the default; with all three off the render stops.

  # A FortiGate is authenticated by its Fortinet-issued client certificate,
  # the only credential: one that presents none is refused (401).

  # A client certificate's CN must equal the FortiGate's serial-number header.
  # Set false only for FortiGates that present the FIRMWARE certificate
  # (CN=FortiGate on every unit). The serial is then only the device's own claim.
  bindSerial: true

  # The organization to serve. Empty = the deployment's only one.
  orgId: ""

  # Go heap ceiling. Empty (the default) = 9/10 of resources.limits.memory,
  # which the module reads from the Downward API, as llm-gateway does; a value
  # here (e.g. 1800MiB) is used as it is instead.
  goMemLimit: ""
  # Extra environment variables for settings not listed above, e.g.
  #   FABRIC_MAX_PENDING: "1000"          devices waiting for authorization at once
  #   FABRIC_SCAN_TIMEOUT_SECONDS: "30"
  # Every setting: fabric/README.md.
  #
  # FABRIC_TEST_SCAN_DELAY is ON in this chart, so that the FortiGate team can
  # test the scan time-out with no change to a deployment: it serves
  # /fabric/api/v1/test/scan_delay, which makes a FortiGate's scans wait,
  # inside their time-out, on purpose (per replica). The module's own
  # default is false.
  # TURN IT OFF BEFORE THE FINAL RELEASE: delete the entry below. A deployment
  # turns it off now with --set-string fabric.env.FABRIC_TEST_SCAN_DELAY=false
  env:
    FABRIC_TEST_SCAN_DELAY: "true"

  # The /scan2 stream scan window, in CHARACTERS: the same pair as
  # llmGateway.env.inStream above, for FortiGate streams. Every scan judges
  # all the answer so far; a scan fires once the text past `scanned` holds
  # windowChars, and holdbackChars of its tail are kept back and judged again
  # with the next scan. Empty = the module's defaults (1024 / 256), floors
  # 100 / 100; a hold-back above half the window is clamped to half, with a
  # WARN at start. Beside `env`, not inside it: `env` is rendered verbatim.
  # Renamed from chunkChars / overlapChars on 2026-11-05; the old keys are
  # ignored, and helm prints a warning.
  inStream:
    windowChars: ""
    holdbackChars: ""

  resources:
    limits:
      cpu: 5000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 512Mi

# Action Guard — agent tool-call guard on :8002: a proposed action gets allow /
# alert / block / human_approval. Always deployed; mcp-gateway calls it. Topic
# Guard runs in-process over this chart's guardrail pool, with the MCP
# guardrails of the agent policies. Its own database and Redis index on the
# shared servers.
actionGuard:
  replicas: 1

  # Extra environment, rendered verbatim. Do not repeat DATABASE_URL,
  # REDIS_URL or REDIS_CLUSTER, which the template sets. Overridable here:
  # EVENT_BUS_ENABLED (true),
  # FAIG_GUARDRAIL_ADDR (guardrail:50051), DB_POOL_SIZE / DB_MAX_OVERFLOW
  # (10 / 5), SESSION_HISTORY_MAX_TRACES (24: the newest session traces a
  # tool call is judged with, 0 = all); the rest with their defaults in
  # action-guard/internal/config/config.go. An unknown (misspelled) key is
  # ignored silently.
  env: {}

  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

# MCP Gateway. Always deployed. Agents call /mcp/gateways/{id} with a virtual
# key through the platform ingress; api-go serves the /api/v1 MCP routes
# itself, and the gateway runs the discovery and scan jobs it queues.
mcpGateway:
  replicas: 1
  # PoC default for governed MCP servers AND true-passthrough endpoints.
  # Set verify: true to validate upstream certificates and hostnames. A private
  # CA must then be included in the service's SSL_CERT_FILE trust bundle.
  upstreamTls:
    verify: false
  egress:
    # Empty = allow configured public/private hosts and nonstandard ports.
    # Opt in to filtering: allowedHosts: ["mcp.example.com", "10.0.0.8:8443"].
    # A hostname permits any port; host:port restricts that port too.
    allowedHosts: []
  # Workload Secret (tls.crt, tls.key, ca.crt) for Auth; required with
  # auth.enabled.
  workloadTlsSecretName: ""

  # Extra environment, rendered verbatim (mcp-gateway/src/config/config.go);
  # do not repeat what the template sets. Bump MCP_SCAN_MODEL_REVISION with
  # each policyGuard model release, so auto-scans run again.
  env: {}

  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # The pod's stdio-runner container, where stdio MCP servers (npx / python)
  # run: one process per discovery and per tool call.
  stdioRunner:
    # An npx server takes some 200 MiB, and an out-of-memory kill ends every
    # server at once.
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

# Observability — agent session/trace recording on :8004. Always deployed;
# mcp-gateway and plugin-adapter record there, action-guard reads the session
# history. The session log is in FortiAIGate's database; its trace cache is
# its own Redis index on the shared server.
observability:
  replicas: 1

  # Extra environment, rendered verbatim. The session pool uses Helm defaults
  # of 25 + 10 = 35 maximum connections per replica.
  env:
    DB_POOL_SIZE: "25"
    DB_MAX_OVERFLOW: "10"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Storage Configuration
storage:
  # Storage size and class configuration for API and Core services
  size: 16Gi
  storageClass: ""  # Use default storage class

  # Storage deployment modes:
  # 1. Dynamic provisioning (default): Leave existingPvName empty
  #    - Creates PVC with storage class, auto-creates PV via storage class
  # 2. Bind to existing PV: Set existingPvName to the name of existing PV
  #    - Creates PVC that binds to the specified existing PV
  #    - User must manually create the PV first

  # Use existing PV name (leave empty for auto-creation)
  # When specified, creates a PVC that binds to the existing PV
  existingPvName: ""

# SSO (SAML 2.0)
sso:
  # The deployment's PUBLIC base URL — what the browser and the identity
  # provider reach this deployment on (scheme + host, no path). It seeds the
  # SP entity ID / ACS URL prefill on the admin Authentication page; the value
  # the ACS actually validates against is the one the admin confirms there.
  # Empty: falls back to https://<ingress.host> when that is set, else the
  # server guesses from request headers and the UI asks the admin to confirm.
  externalUrl: ""

# Ingress Configuration
ingress:
  # Controller type for a custom class (e.g. className: qa23443, controllerType: nginx).
  controllerType: ""
  className: "nginx" # You need update this to your ingress used
  host: ""  # Optional: Set to a specific hostname to enable host-based routing
  # Custom annotations that take priority over predefined controller settings
  # When provided, these annotations will be used instead of controller-specific ones
  #
  # NOTE: For NGINX and ALB ingress controllers, default TLS backend annotations are automatically
  # configured. However, if you're using a different ingress controller (Contour, Istio, etc.) and you enable TLS for backend,
  # you MUST add the appropriate annotations here to ensure HTTPS backend connectivity.
  #
  # Example for custom NGINX TLS backend (overrides default NGINX configuration):
  # annotations:
  #   nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  #   nginx.ingress.kubernetes.io/ssl-redirect: "true"
  annotations: {}
  healthcheck:
    api: /openapi.json
    llmGateway: /fortiaigate/health/readiness
    webui: /ui
  # Traefik with tls.enabled: the backend Services carry the HTTPS scheme and a
  # ServersTransport, whatever annotations says (Traefik reads the backend
  # scheme off the Service only). Empty = the chart renders
  # fortiaigate-backend-tls, which, as ingress-nginx and an ALB, does not verify
  # the backend certificate. To verify, name your own ServersTransport here
  # (with your CA and serverName) as <namespace>-<name>@kubernetescrd.
  traefik:
    serversTransport: ""

# TLS Configuration
tls:
  # Enable/disable TLS for all services except postgresql and redis
  enabled: true

  # Terraform supplies the certificate and its rotation checksum.
  existingSecret: ""
  existingSecretChecksum: ""
  internalExistingSecret: ""
  internalExistingSecretChecksum: ""
  internalMountPath: "/etc/internal-tls"

  # Mutual TLS between the deployment's own pods (needs enabled): every
  # internal server also requires the client's certificate, so only a pod that
  # holds the deployment's internal key gets in. It covers the guardrail pool
  # (guardrail, dlp-scanner, policy-guard), the licence manager, Action Guard,
  # Observability, Triton's gRPC port and vLLM; a client presents the same
  # internal certificate the servers serve, whose key usage allows both. The
  # health paths (the licence manager's and Observability's /healthz and
  # /readyz, Action Guard's /healthz, the guardrail pool's health port) stay
  # open for the kubelet, which presents no certificate. PostgreSQL and Redis
  # have their own switches, postgresql.tls.certCAFilename and
  # redis.tls.authClients, both on.
  mutual: true

  # TLS mount path in containers
  mountPath: "/etc/tls"

  # The certificate the Ingress, and every service it routes to (webui, api,
  # llm-gateway, plugin-adapter, mcp-gateway, inference-hooks), present to
  # clients (self-signed or signed by a CA). You need to provide your own
  # certificate and key. Traffic between the pods uses a certificate the chart
  # generates.
  cert: files/certificate/dflt.crt
  key: files/certificate/dflt.key

# PostgreSQL Configuration
# For advanced configuration options, refer to:
# https://github.com/bitnami/charts/tree/main/bitnami/postgresql#parameters
postgresql:
  enabled: true  # Enable PostgreSQL service
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.4.0-debian-12-r19
    pullPolicy: IfNotPresent
  auth:
    username: "fortiaigate_postgres_user"
    database: "fortiaigate_db"

  # TLS Configuration for PostgreSQL
  tls:
    # Enable TLS for PostgreSQL
    enabled: true
    # Use existing secret created by main chart
    certificatesSecret: "fortiaigate-tls-secret"
    # Certificate filename in the secret
    certFilename: "tls.crt"
    # Certificate key filename in the secret
    certKeyFilename: "tls.key"
    # The CA PostgreSQL verifies client certificates against: the internal
    # certificate itself. With it the rules below require one (mutual TLS);
    # empty leaves them password-only.
    certCAFilename: "tls.crt"
    # Prefer server ciphers
    preferServerCiphers: true

  # Enable volumePermissions for tls support
  volumePermissions:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r50

  primary:
    # Restart PostgreSQL when the chart-generated internal certificate changes
    podAnnotations:
      checksum/tls: '{{ if .Values.tls.enabled }}{{ include "fortiaigate.internalTlsRevision" . | sha256sum }}{{ end }}'
    # Client authentication (pg_hba.conf). With postgresql.tls.enabled,
    # PostgreSQL accepts a client from another pod only over TLS (hostssl),
    # and refuses a plaintext login whatever its password. With
    # tls.certCAFilename as well it is mutual TLS: the client must also present
    # a certificate that verifies against that file (clientcert=verify-ca), on
    # top of its password. Every pod that uses the database presents the
    # internal pair (POSTGRES_SSL_CERTFILE/KEYFILE). Without
    # postgresql.tls.enabled these are the image's own rules (host), so the
    # clients still get in. The local socket and the loopback stay open: only
    # processes in the PostgreSQL pod reach them, its pg_isready probes on
    # 127.0.0.1 among them. md5 also takes a password stored as SCRAM, with
    # SCRAM.
    # The sub-chart renders this as a template, so .Values.tls here is
    # postgresql.tls; it mounts the result as a ConfigMap at
    # /bitnami/postgresql/conf and restarts PostgreSQL when it changes. It
    # must never render empty: an empty pg_hba.conf refuses every client.
    pgHbaConfiguration: |-
      # Managed by the FortiAIGate chart (postgresql.primary.pgHbaConfiguration).
      local    all  all                 md5
      host     all  all  127.0.0.1/32   md5
      host     all  all  ::1/128        md5
      {{ ternary "hostssl" "host" .Values.tls.enabled }}  all  all  0.0.0.0/0  md5{{ if and .Values.tls.enabled .Values.tls.certCAFilename }}  clientcert=verify-ca{{ end }}
      {{ ternary "hostssl" "host" .Values.tls.enabled }}  all  all  ::/0       md5{{ if and .Values.tls.enabled .Values.tls.certCAFilename }}  clientcert=verify-ca{{ end }}
    persistence:
      enabled: true
      size: 16Gi
      storageClass: ""
      # Use existing PVC created by storage configuration
      # This will be automatically set to the correct PVC name by the template
      existingClaim: '{{ include "fortiaigate.storageClaim" . }}'
      # Access modes for the PVC (e.g., ["ReadWriteOnce", "ReadWriteMany"])
      # Leave empty to use default from storage class
      # For advanced options, see Bitnami PostgreSQL documentation
      accessModes: ["ReadWriteMany"]
    resources:
      limits:
        cpu: 1000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
    service:
      type: ClusterIP
      port: 5432

# Redis Configuration
# For advanced configuration options, refer to:
# https://github.com/bitnami/charts/tree/main/bitnami/redis#parameters
redis:
  enabled: true  # Enable Redis service
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 8.2.0-debian-12-r0
    pullPolicy: IfNotPresent
  architecture: standalone  # Run single master node instead of master-replica

  # TLS Configuration for Redis
  tls:
    # Enable TLS for Redis
    enabled: true
    # Use existing secret created by main chart
    existingSecret: "fortiaigate-tls-secret"
    # Certificate filename in the secret
    certFilename: "tls.crt"
    # Certificate key filename in the secret
    certKeyFilename: "tls.key"
    # CA Certificate filename in the secret
    certCAFilename: "tls.crt"
    # Mutual TLS: Redis also requires the client's certificate, verified
    # against certCAFilename. Every pod that dials Redis presents the internal
    # pair (REDIS_SSL_CERTFILE/KEYFILE), and so do the sub-chart's probes.
    authClients: true

  # Redis configuration. Keep all four lines: this block replaces the Redis
  # sub-chart's defaults entirely, so removing appendonly/save turns persistence
  # off. Redis stores the node's licence state, and losing it on a restart can
  # leave the node unlicensed until it re-registers.
  #
  # maxmemory must stay BELOW master.resources.limits.memory below, with room to
  # spare (2048mb against 4Gi): background saves need extra memory, and a
  # Redis that reaches the container limit is killed rather than slowed. Raise
  # both together if you raise either.
  #
  # master.resources.requests.memory is at least maxmemory, so that a node that
  # runs short of memory does not evict Redis first. Raise it with maxmemory.
  #
  # noeviction means Redis refuses new writes when full instead of discarding
  # data it already holds. Do not change it to an eviction policy — those would
  # drop sessions and licence state to make room for traffic logs.
  commonConfiguration: |-
    # Enable AOF https://redis.io/topics/persistence#append-only-file
    appendonly yes
    # Disable RDB persistence, AOF persistence already enabled.
    save ""
    maxmemory 2048mb
    maxmemory-policy noeviction

  master:
    # Restart Redis when the chart-generated internal certificate changes
    podAnnotations:
      checksum/tls: '{{ if .Values.tls.enabled }}{{ include "fortiaigate.internalTlsRevision" . | sha256sum }}{{ end }}'
    persistence:
      enabled: true
      size: 4Gi
      storageClass: ""
      # Use existing PVC created by storage configuration
      # This will be automatically set to the correct PVC name by the template
      existingClaim: '{{ include "fortiaigate.storageClaim" . }}'
      # Access modes for the PVC (e.g., ["ReadWriteOnce", "ReadWriteMany"])
      # Leave empty to use default from storage class
      # For advanced options, see Bitnami Redis documentation
      accessModes: ["ReadWriteMany"]
    resources:
      limits:
        cpu: 1000m
        memory: 4Gi
      requests:
        cpu: 250m
        memory: 2Gi
    service:
      type: ClusterIP
      port: 6379

# Auth starts on the first installation. Its identity Job creates persistent
# workload/vault/signing material. Organization and public URL come from setup.
auth:
  # Running LLM replicas require bundled Auth for RBAC usage accounting.
  # External-Auth MCP-only deployments must set llmGateway.replicas to 0.
  enabled: true
  autoProvision: true
  image: auth
  replicas: 1
  # Optional existing component Secrets use ordinary, unprefixed file keys.
  # Empty names use the persistent installation bundle created automatically.
  serverSecretName: ""
  apiWorkloadSecretName: ""
  llmWorkloadSecretName: ""
  llmWorkloadIdentity: spiffe://faig/deployment/llm-gateway
  # Provisioned API/MCP/LLM certificates must contain these URI SANs.
  apiWorkloadIdentity: spiffe://faig/deployment/api
  mcpWorkloadIdentity: spiffe://faig/deployment/mcp-gateway
  pluginAdapterMcpWorkloadIdentity: spiffe://faig/deployment/plugin-adapter-mcp
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 2000m, memory: 1Gi}
  # Optional provider egress policy file; mount it through a separate Secret.
  egressSecretName: ""
  upstreamTls:
    # PoC default for external OAuth, JWKS, UserInfo, refresh, discovery and
    # directory/exchange requests. Token signatures/claims and workload mTLS
    # are still verified. Set true to validate provider certificates.
    verify: false
    # Optional existing Secret with key ca.crt, appended to system roots when
    # verification is enabled. Example: caSecretName: company-idp-ca
    caSecretName: ""
  egress:
    # No vendor allowlist by default. Configured HTTPS endpoints may be on
    # public/private networks and arbitrary HTTPS ports.
    # To filter, set e.g. allowedHosts: ["login.microsoftonline.com", "idp.example.com:8446"].
    # The legacy egressSecretName policy remains an explicit exact-URL/CA
    # restriction when configured; leave it empty for the default open policy.
    allowedHosts: []
